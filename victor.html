var bellPcm = null;
function bell(){
  if (bellPcm) return bellPcm;
  bellPcm = new Int16Array(0);
  try {
    var bin = atob(BELL_B64), n = bin.length >> 1, a = new Int16Array(n), v;
    for (var i = 0; i < n; i++){
      v = bin.charCodeAt(i * 2) | (bin.charCodeAt(i * 2 + 1) << 8);
      a[i] = v > 32767 ? v - 65536 : v;
    }
    bellPcm = a;
  } catch (e) {}
  return bellPcm;
}

function hasAudio(){ return !!(alarmEl && typeof alarmEl.play === "function"); }
function canAsk(){
  return typeof Notification !== "undefined" && Notification.permission === "default";
}

/* The lead-in is a ±2 LSB dither rather than digital silence, which is some 84
   dB down — inaudible, but real audio, so the phone treats this as playback
   worth keeping alive. Then the bell, twice. */
function alarmSrc(silentSec){
  var b = bell(), RATE = BELL_RATE;
  var gap = Math.round(BELL_GAP * RATE);
  var tail = gap + b.length;
  var lead = Math.round(Math.max(0, silentSec) * RATE);
  var n = lead + tail, bytes = 44 + n * 2;
  var buf = new ArrayBuffer(bytes), dv = new DataView(buf), i;
  function tag(off, str){ for (var j = 0; j < str.length; j++) dv.setUint8(off + j, str.charCodeAt(j)); }
  tag(0, "RIFF"); dv.setUint32(4, bytes - 8, true); tag(8, "WAVEfmt ");
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, RATE, true); dv.setUint32(28, RATE * 2, true);
  dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
  tag(36, "data"); dv.setUint32(40, n * 2, true);
  for (i = 0; i < lead; i++) dv.setInt16(44 + i * 2, i % 2 ? 2 : -2, true);
  for (i = 0; i < tail; i++){
    var v = (i < b.length ? b[i] : 0) + (i >= gap ? b[i - gap] : 0);
    dv.setInt16(44 + (lead + i) * 2, clamp(v, -32768, 32767), true);
  }
  return URL.createObjectURL(new Blob([buf], {type: "audio/wav"}));
}

function armAlarm(secs){
  if (!hasAudio()) return;
  stopAlarm();
  try {
    alarmUrl = alarmSrc(secs);
    alarmEl.src = alarmUrl;
    var p = alarmEl.play();
    if (p && p.catch) p.catch(function(){});
    wireMedia();
  } catch (e) {}
}
function stopAlarm(){
  try { if (hasAudio()) alarmEl.pause(); } catch (e) {}
  if (alarmUrl){
    try { URL.revokeObjectURL(alarmUrl); } catch (e) {}
    alarmUrl = null;
  }
}

/* If the armed file was stopped somewhere along the way — the phone reclaimed
   it, the tab was frozen — the rest still ends, so sound it now. */
function alarmFallback(){
  try { if (hasAudio() && alarmEl.paused) armAlarm(0); } catch (e) {}
}

/* Lock-screen transport, so pausing there pauses the rest rather than leaving
   a phantom player running. */
function wireMedia(){
  try {
    if (!navigator.mediaSession) return;
    if (typeof MediaMetadata === "function"){
      navigator.mediaSession.metadata = new MediaMetadata({title: "Rest timer", artist: "Rolling Five"});
    }
    navigator.mediaSession.setActionHandler("pause", function(){ timerDo("tplay"); });
    navigator.mediaSession.setActionHandler("play", function(){ timerDo("tplay"); });
  } catch (e) {}
}

/* Keeps the screen up while a rest runs, which is the case where nothing can go
   wrong at all. Released the moment it is not needed. */
function holdScreen(on){
  try {
    if (on && !wakeLock && navigator.wakeLock && navigator.wakeLock.request){
      navigator.wakeLock.request("screen").then(function(w){ wakeLock = w; }, function(){});
    } else if (!on && wakeLock){
      wakeLock.release(); wakeLock = null;
    }
  } catch (e) { wakeLock = null; }
}

function notifyOver(){
  try {
    if (typeof Notification === "undefined" || Notification.permission !== "granted") return;
    var body = fmtClock(state.timer.dur) + " rest is up. Next set.";
    if (navigator.serviceWorker && navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(function(reg){
        reg.showNotification("Rest over", {body: body, tag: "rest", renotify: true});
      }, function(){});
    } else {
      new Notification("Rest over", {body: body, tag: "rest"});
    }
  } catch (e) {}
}

/* Writes the clock into the nodes that are already there. Never re-renders:
   the session screen is full of text fields, and a tick that stole the keyboard
   once a second would be unusable. */
function paintTimer(){
  var box = document.getElementById("tmr");
  if (!box) return;
  var t = state.timer, now = Date.now(), ph = timerPhase(t, now);
  box.className = "timer " + ph;
  var el = document.getElementById("t-clock");
  if (el) el.textContent = fmtClock(Math.max(0, timerLeft(t, now)));
  el = document.getElementById("t-label");
  if (el) el.textContent = TIMER_LABEL[ph];
  el = document.getElementById("t-fill");
  if (el && el.style) el.style.width = timerPct(t, now) + "%";
  el = document.getElementById("t-play");
  if (el) el.textContent = ph === "running" ? PAUSE : PLAY;
  if (!document.querySelectorAll) return;
  var chips = document.querySelectorAll('[data-a="tdur"]');
  for (var i = 0; i < chips.length; i++){
    chips[i].className = Number(chips[i].dataset.v) === t.dur ? "on" : "";
  }
}

function tick(){
  var ph = timerPhase(state.timer, Date.now());
  paintTimer();
  if (ph === "over"){
    if (!fired){ fired = true; alarmFallback(); notifyOver(); }
    stopTicking(); holdScreen(false);
  } else if (ph !== "running") stopTicking();
}
function startTicking(){
  if (tickHandle == null && typeof setInterval === "function") tickHandle = setInterval(tick, 250);
}
function stopTicking(){
  if (tickHandle != null && typeof clearInterval === "function") clearInterval(tickHandle);
  tickHandle = null;
}

/* One place where a timer value change turns into sound, screen and ticking, so
   no action has to remember the four of them. */
function syncTimer(){
  var t = state.timer, ph = timerPhase(t, Date.now());
  if (ph === "running"){
    fired = false;
    armAlarm(timerLeft(t, Date.now()));
    holdScreen(true);
    startTicking();
  } else {
    stopAlarm();
    holdScreen(false);
    if (ph !== "over") stopTicking();
  }
}

function timerDo(a, v){
  var now = Date.now(), t = state.timer;
  if (a === "tplay") state.timer = timerToggle(t, now);
  else if (a === "treset") state.timer = timerReset(t);
  else if (a === "tstart") state.timer = timerStart(t, now);
  else if (a === "tdur") state.timer = timerSetDur(t, Number(v));
  syncTimer(); saveState(); paintTimer();
}

/* ============================== ACTIONS ============================== */

function startSession(){
  var c = ctx(), sets = {}, exs = [];
  c.exercises.forEach(function(ex){
    var n = plannedSets(c, ex), arr = [];
    for (var i = 0; i < n; i++) arr.push({w:"", r:"", done:false});
    sets[ex.id] = arr; exs.push(ex.id);
  });
  state.draft = {index:state.index, exs:exs, sets:sets, fb:{}};
  saveState();
  view = "session"; openWhy = null; ask = null; render();
}

/* What the session just changed about the program itself, for the summary. */
function changesFrom(before, after){
  var out = [];
  Object.keys(SKILLS).forEach(function(id){
    var s = SKILLS[id], b = before.levels[id].level, a = after.levels[id].level;
    if (a > b) out.push({col:"#a78bfa", head:s.name + " → step " + a,
      body:"Clean at " + s.critSets + " × " + s.crit + s.unit + ". Next up: " + s.ladder[a - 1] + "."});
    else if (a < b) out.push({col:"#f43f5e", head:s.name + " back to step " + a,
      body:"The position went. Rebuild it at " + s.ladder[a - 1] + " rather than grinding degraded reps."});
  });
  if (!before.cut && after.cut) out.push({col:"#f43f5e", head:"Straight-arm volume halved for " + ELBOW_DAYS + " days",
    body:"Front lever and straight-arm sets are cut in half, not stopped. It restores itself."});
  if (before.cut && !after.cut) out.push({col:"#fbbf24", head:"Straight-arm volume back to full", body:"The elbow week is up."});
  if (!before.press && after.press) out.push({col:"#fb923c", head: cutName() + " comes off Push",
    body:"You reported the handstand work heavy. It is the first thing the program cuts."});
  if (before.press && !after.press) out.push({col:"#fbbf24", head: cutName() + " is back on Push",
    body:"The handstand work is not reading heavy any more."});
  if (!before.trim && after.trim) out.push({col:"#fb923c", head:"Skill B cut to practice", body:after.trim.why + " " + after.trim.how});
  if (before.trim && !after.trim) out.push({col:"#fbbf24", head:"Skill B back to full", body:"Whatever was cutting it has cleared."});
  return out;
}
function snapshot(){
  var now = Date.now(), levels = {};
  Object.keys(SKILLS).forEach(function(k){ levels[k] = levelRun(k, state.history, state.tests); });
  return {levels:levels, cut:straightArmCut(state.history, now), trim:skillBTrim(state.history, now), press:pressCut(state.history)};
}

function commit(){
  var c = ctx(), before = snapshot();
  state.history.push({
    ts: Date.now(), cycle: c.cycle, slot: c.slot.id,
    sets: state.draft.sets, fb: state.draft.fb
  });
  ask = null;
  state.index += 1;
  state.draft = null;
  peek = null;
  /* the session is over, so the rest between its sets is too — nothing should
     go off in your pocket on the walk home */
  state.timer = timerReset(state.timer);
  syncTimer();
  saveState();
  var after = snapshot();

  var n = ctx();
  summary = {
    justDid: c.slot.name, slotName: n.slot.name, pos: posOf(n.abs), cycle: n.cycle,
    changes: changesFrom(before, after),
    targets: n.exercises.map(function(ex){
      var t = n.targets[ex.id];
      return {ex:ex, sets:plannedSets(n, ex), reps:t.reps, weight:t.weight, why:t.why};
    })
  };
  view = "summary"; render();
}

document.addEventListener("click", function(e){
  var el = e.target.closest("[data-a]");
  if (!el) return;
  var a = el.dataset.a, exId = el.dataset.ex, c = ctx();

  if (a === "nav"){
    tab = el.dataset.tab;
    if (tab === "cycle" && view === "summary") view = "home";
    confirmErase = false; peek = null;
    render(); return;
  }

  /* Looking around the cycle. Nothing here writes to a session. */
  if (a === "peekprev"){ peek = Math.max(state.index, peekIndex() - 1); render(); return; }
  if (a === "peeknext"){ peek = Math.min(peekLast(), peekIndex() + 1); render(); return; }
  if (a === "peektoday"){ peek = null; render(); return; }
  if (a === "peekat"){
    peek = clamp(Number(el.dataset.i), state.index, peekLast());
    tab = "cycle"; view = "home"; render(); return;
  }

  if (a === "start"){ peek = null; startSession(); return; }
  if (a === "resume"){ view = "session"; render(); return; }
  if (a === "back"){ view = "home"; render(); return; }
  if (a === "why"){ openWhy = openWhy === exId ? null : exId; render(true); return; }

  if (a === "toggle"){
    var i = Number(el.dataset.i), row = state.draft.sets[exId][i];
    var t = c.targets[exId], ex = exById(exId);
    /* Nothing gets into history without a load behind it. Bodyweight work has
       one already — the body — so it logs at 0 with the field empty. */
    if (!row.done && row.w === "" && (t.weight == null) && !loadless(ex)){
      needWeight = exId + ":" + i; render(true); return;
    }
    needWeight = null;
    row.done = !row.done;
    if (row.done){
      if (row.w === "") row.w = String(t.weight == null ? 0 : t.weight);
      if (row.r === "") row.r = String((t.lastReps && t.lastReps[i] != null) ? t.lastReps[i] : t.reps);
      askIfPending(c);
      /* The set is done, so the rest has started. This runs inside the tap that
         logged it, which is the gesture the alarm needs to be allowed to play. */
      timerDo("tstart");
    }
    saveState(); render(true); return;
  }
  if (a === "addset"){
    state.draft.sets[exId].push({w:"", r:"", done:false});
    volumeChanged(c, exId);
    saveState(); render(true); return;
  }
  if (a === "dropset"){
    if (state.draft.sets[exId].length > 1){
      state.draft.sets[exId].pop();
      volumeChanged(c, exId);
    }
    saveState(); render(true); return;
  }

  /* The timer paints itself, so none of these re-render — tapping one mid-set
     must not take the keyboard away from the field being typed in. */
  if (a === "tplay" || a === "treset" || a === "tdur"){ timerDo(a, el.dataset.v); return; }
  if (a === "tnotify"){
    try { Notification.requestPermission().then(function(){ render(true); }, function(){}); } catch (e) {}
    return;
  }

  if (a === "ask" || a === "fbans"){ fb()[el.dataset.k] = Number(el.dataset.v); saveState(); render(true); return; }
  if (a === "asksave" || a === "asklater"){ ask = null; saveState(); render(true); return; }

  if (a === "finish"){
    /* the button is hidden until the last set is in; this is the invariant
       behind it — nothing reaches history half-recorded */
    if (setsLeft()) { render(true); return; }
    ask = null;
    if (!missingFeedback(c).length) commit();
    else { view = "feedback"; render(); }
    return;
  }
  if (a === "fbcancel"){ view = "session"; render(); return; }
  if (a === "fbsave"){ if (!missingFeedback(c).length) commit(); return; }
  if (a === "summarydone"){ view = "home"; render(); return; }
  if (a === "selex"){ selEx = exId; render(true); return; }

  if (a === "logtest"){
    var id = el.dataset.t, v = Number(testDraft[id]);
    if (!(v > 0)) return;
    if (!state.tests[id]) state.tests[id] = [];
    state.tests[id].push({ts:Date.now(), v:v, cycle:c.cycle});
    testDraft[id] = "";
    saveState(); render(true); return;
  }
  if (a === "plates"){
    state.plates = clamp(state.plates + Number(el.dataset.v), 100, 800);
    saveState(); render(true); return;
  }

  if (a === "skipback"){ state.index = Math.max(0, state.index - 1); state.draft = null; peek = null; saveState(); render(); return; }
  if (a === "skipahead"){ state.index += 1; state.draft = null; peek = null; saveState(); render(); return; }
  if (a === "erase-ask"){ confirmErase = true; render(true); return; }
  if (a === "erase-no"){ confirmErase = false; render(true); return; }
  if (a === "erase-yes"){
    state = blank();
    confirmErase = false; peek = null; testDraft = {};
    syncTimer(); saveState(); tab = "cycle"; view = "home"; render(); return;
  }
  if (a === "install" && deferredPrompt){ deferredPrompt.prompt(); deferredPrompt = null; return; }
});

/* The first set carries the working weight for the exercise, once you leave
   the field — filling in real values rather than leaving the rows to hint at
   it. Sets already logged keep what they were logged with. Writes straight
   into the sibling inputs because this path must not re-render. */
function carryWeightDown(exId, rows, value){
  for (var j = 1; j < rows.length; j++){
    if (rows[j].done) continue;
    rows[j].w = value;
    var el = document.querySelector('input[data-ex="' + exId + '"][data-i="' + j + '"][data-f="w"]');
    if (el) el.value = value;
  }
}

/* typing does not re-render, so the keyboard and caret stay put */
document.addEventListener("input", function(e){
  var t = e.target;
  if (!t.dataset) return;
  if (t.dataset.t){ testDraft[t.dataset.t] = t.value; return; }
  if (!t.dataset.ex || !state.draft) return;
  var rows = state.draft.sets[t.dataset.ex];
  if (!rows) return;
  rows[Number(t.dataset.i)][t.dataset.f] = t.value;
  if (t.dataset.f === "w") needWeight = null;
  clearTimeout(window.__saveT);
  window.__saveT = setTimeout(saveState, 400);
});

/* Leaving the first weight field is what carries it down the exercise. Doing
   it per keystroke would flicker 1, 13, 135 through every row below. */
document.addEventListener("focusout", function(e){
  var t = e.target;
  if (!t.dataset || t.dataset.f !== "w" || t.value === "" || !state.draft) return;
  if (Number(t.dataset.i) !== 0) return;
  var rows = state.draft.sets[t.dataset.ex];
  if (!rows) return;
  carryWeightDown(t.dataset.ex, rows, t.value);
  saveState();
});
