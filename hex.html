<style>
  :root{
    --bg:#0b0f14; --card:#141a21; --line:#232c36; --ink:#f2f5f7; --muted:#97a6b3; --dim:#66768a;
    --go:#f5c542; --go-deep:#7a5f10; --danger:#fb7185; --ok:#34d399;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
    overscroll-behavior:none;display:flex;flex-direction:column;height:100dvh
  }
  h1,h2,h3{margin:0;letter-spacing:-0.02em}
  p{margin:0}
  button,input{font:inherit;color:inherit}
  button{background:none;border:none;padding:0;cursor:pointer}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .muted{color:var(--muted)}
  .dim{color:var(--dim)}
  .eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--dim)}

  #app{display:flex;flex-direction:column;flex:1;min-height:0}
  header{background:rgba(11,15,20,.96);border-bottom:1px solid var(--line);
    padding:calc(10px + env(safe-area-inset-top)) 14px 8px;flex:none}
  .htop{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .htop h1{font-size:22px;font-weight:900}
  .htop h1 span{color:var(--dim);font-weight:700}
  main{flex:1;min-height:0;display:flex;flex-direction:column}
  main.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}
  .wrap{padding:16px 16px 24px}

  nav{flex:none;display:flex;border-top:1px solid var(--line);background:var(--bg);
    padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;padding:12px 0 10px;font-size:12px;font-weight:700;text-transform:uppercase;
    letter-spacing:.1em;color:var(--dim)}
  nav button.on{color:var(--go)}

  /* --- design ------------------------------------------------------------ */
  .bar{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);flex:none;
    overflow-x:auto;scrollbar-width:none}
  .bar::-webkit-scrollbar{display:none}
  .bar input{flex:1;min-width:90px;background:var(--card);border:1px solid var(--line);border-radius:9px;
    padding:7px 10px;font-size:15px;font-weight:700;outline:none}
  .bar input:focus{border-color:var(--go)}
  .btn{flex:none;padding:7px 9px;border-radius:9px;border:1px solid var(--line);background:var(--card);
    font-size:12px;font-weight:700;white-space:nowrap}
  .btn.go{background:var(--go);color:#111;border-color:var(--go)}
  .btn.on{border-color:var(--go);color:var(--go)}
  .btn:disabled{opacity:.4}
  .seg{display:flex;flex:none;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .seg button{padding:7px 8px;font-size:12px;font-weight:700;color:var(--dim);background:var(--card)}
  .seg button.on{background:var(--go);color:#111}
  .swatch{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px;
    border:1px solid #888}
  .swatch.b{background:#111}
  .swatch.w{background:#f4f4f2}
  .stage{flex:1;min-height:0;position:relative;background:#0b0f14}
  canvas#floor{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
  .counts{position:absolute;left:10px;bottom:10px;background:rgba(11,15,20,.85);border:1px solid var(--line);
    border-radius:9px;padding:5px 9px;font-size:12px;pointer-events:none}
  .counts b{font-weight:800}
  .hint{position:absolute;left:10px;top:10px;background:rgba(11,15,20,.85);border:1px solid var(--line);
    border-radius:9px;padding:5px 9px;font-size:12px;color:var(--muted);pointer-events:none}
  .dirty{color:var(--go)}

  /* --- layouts ------------------------------------------------------------ */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .card canvas{display:block;width:100%;background:#0b0f14}
  .card .body{padding:10px 12px 12px}
  .card h3{font-size:15px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .meta{font-size:12px;color:var(--muted);margin-top:2px}
  .card .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .card .acts .btn{padding:6px 9px;font-size:12px}
  .card.now{border-color:var(--go)}
  .empty{padding:32px 16px;text-align:center;color:var(--muted)}
  .rename{display:flex;gap:6px;margin-top:8px}
  .rename input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--go);border-radius:8px;padding:6px 9px;outline:none}
  .warn{border:1px solid var(--danger);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:13px}
  .warn .btn{margin-top:6px}

  /* --- plan ---------------------------------------------------------------- */
  .plan h2{font-size:18px;font-weight:900;margin:22px 0 8px}
  .plan h2:first-child{margin-top:0}
  .plan p{margin:0 0 10px;color:var(--muted);font-size:14px}
  .plan p b{color:var(--ink)}
  table{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0 4px}
  th,td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);font-weight:700}
  td.n{text-align:right;font-family:var(--mono);font-weight:700;white-space:nowrap}
  td.c{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
  tr.inf td{color:var(--muted)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:6px 0 2px}
  .legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}
  .install{margin:14px 0 0;display:none}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

/* ============================== PROGRAM ============================== */

/* The floor is a hex mosaic, pointy-top hexagons in horizontal rows. A cell is
   (c, r): column c, row r. Odd rows sit half a cell east. Units are one hex
   width; a row is HEX_H of that. North is row decreasing, east is column
   increasing, so the plan reads with the bay window at the top, the entry door
   at the bottom, the vanity wall on the right and the shower on the left.

   Origin (0, 0) is the north-west corner dot of the main border. Every number
   below was read off the four site photos by counting black dots along each
   run; the Plan tab says which photos each run was counted in. */

var HEX_H = 0.8660254;

/* Where tile exists, as inclusive rectangles [c0, c1, r0, r1], plus the bay,
   which is chamfered one column per row on each side. These only decide which
   cells can be painted; they do not move a black dot. Margins between a border
   and its wall are read off the photos to about a cell. */
var FLOOR = {
  rects: [
    [-2, 61, -2, 70],   /* main room out to its walls */
    [-8, -3, 7, 43],    /* the shower mouth, between its east column and the main border */
    [-42, -9, 7, 43],   /* shower */
    [-42, -8, 48, 70],  /* toilet room, directly south of the shower through the niche wall */
    [-7, -3, 51, 66],   /* the toilet room's door, in its east wall */
    [8, 42, 71, 84]     /* door neck out to the threshold */
  ],
  bay: {top: -14, bottom: -3, c0: 2, c1: 56}
};

/* Solid walls drawn inside the floor's bounding box, for orientation only. */
var LABELS = [
  {t:"BAY WINDOW", c:29, r:-9}, {t:"VANITY", c:63.5, r:34, rot:1, light:1}, {t:"DOOR", c:25, r:88, light:1},
  {t:"SHOWER", c:-25, r:25}, {t:"WC", c:-25, r:59}, {t:"NICHE WALL", c:-23, r:45.6, small:1, light:1}
];

/* The fixed border. Each run is a straight dotted line from one dot to another,
   stepping two cells: along a row that leaves one white between blacks, down a
   column it leaves one row, which reads as a straight line because rows two
   apart share an offset. `dots` is the count read off the photos, corners
   included, and the test suite checks the geometry produces exactly that. */
var SEGMENTS = [
  {id:"main-north", name:"Main border, north row, along the bay", from:[0,0], to:[58,0], dots:30, seen:"B, C"},
  {id:"main-east", name:"Main border, east column, vanity wall", from:[58,0], to:[58,68], dots:35, seen:"B, C"},
  {id:"main-west", name:"Main border, west column", from:[0,0], to:[0,68], dots:35, seen:"A, B, C"},
  {id:"step-east", name:"South wall, east of the door", from:[40,68], to:[58,68], dots:10, seen:"B, C"},
  {id:"neck-east", name:"Door recess, east side", from:[40,68], to:[40,82], dots:8, seen:"B, C"},
  {id:"threshold", name:"Door threshold", from:[10,82], to:[40,82], dots:16, seen:"C"},
  {id:"neck-west", name:"Door recess, west side", from:[10,68], to:[10,82], dots:8, seen:"A, B, C"},
  {id:"step-west", name:"South wall, west of the door", from:[0,68], to:[10,68], dots:6, seen:"A, B, C"},
  {id:"shower-north", name:"Shower, north row", from:[-41,8], to:[-9,8], dots:17, seen:"A, B"},
  {id:"shower-south", name:"Shower, south row, along the niche wall", from:[-41,42], to:[-9,42], dots:17, seen:"A, C"},
  {id:"shower-west", name:"Shower, west column, back wall", from:[-41,8], to:[-41,42], dots:18, seen:"A"},
  {id:"shower-east", name:"Shower, east column, at the door", from:[-9,8], to:[-9,42], dots:18, seen:"A, B, C"},
  {id:"wc-north", name:"Toilet room, north row, along the niche wall", from:[-41,50], to:[-9,50], dots:17, seen:"D"},
  {id:"wc-south", name:"Toilet room, south row", from:[-41,68], to:[-9,68], dots:17, seen:"C, D"},
  {id:"wc-east", name:"Toilet room, east column, at the door", from:[-9,50], to:[-9,68], dots:10, seen:"C, D"},
  {id:"wc-west", name:"Toilet room, west column, behind the toilet", from:[-41,50], to:[-41,68], dots:10, seen:"D"}
];

function segmentCells(seg){
  var out = [], dc = seg.to[0] > seg.from[0] ? 2 : 0, dr = seg.to[1] > seg.from[1] ? 2 : 0;
  for (var c = seg.from[0], r = seg.from[1]; c <= seg.to[0] && r <= seg.to[1]; c += dc, r += dr){
    out.push([c, r]);
    if (!dc && !dr) break;
  }
  return out;
}

/* ============================== ENGINE ============================== */

function key(c, r){ return c + "," + r; }
function unkey(k){ var p = k.split(","); return [+p[0], +p[1]]; }
function isOdd(r){ return ((r % 2) + 2) % 2 === 1; }

function hexCenter(c, r){
  return {x: c + (isOdd(r) ? 0.5 : 0), y: r * HEX_H};
}
/* Nearest centre wins, which is exactly the hexagon the point is in. */
function hexAt(x, y){
  var r0 = Math.round(y / HEX_H), best = null, bd = 1e9;
  for (var r = r0 - 1; r <= r0 + 1; r++){
    var c0 = Math.round(x - (isOdd(r) ? 0.5 : 0));
    for (var c = c0 - 1; c <= c0 + 1; c++){
      var p = hexCenter(c, r), d = (p.x - x) * (p.x - x) + (p.y - y) * (p.y - y);
      if (d < bd){ bd = d; best = [c, r]; }
    }
  }
  return best;
}
/* Corners of a pointy-top hex of width w centred at (x, y), as a flat array. */
function hexCorners(x, y, w){
  var R = w / Math.sqrt(3), out = [];
  for (var i = 0; i < 6; i++){
    var a = Math.PI / 180 * (60 * i + 30);
    out.push(x + R * Math.cos(a), y + R * Math.sin(a));
  }
  return out;
}

/* The set of every cell that exists, and of every cell that is a fixed dot. */
var floor = {}, fixed = {}, BOUNDS = null;
(function buildFloor(){
  var i, c, r, k;
  for (i = 0; i < FLOOR.rects.length; i++){
    var q = FLOOR.rects[i];
    for (c = q[0]; c <= q[1]; c++) for (r = q[2]; r <= q[3]; r++) floor[key(c, r)] = 1;
  }
  var b = FLOOR.bay;
  for (r = b.bottom; r >= b.top; r--){
    var k0 = b.bottom - r;
    for (c = b.c0 + k0; c <= b.c1 - k0; c++) floor[key(c, r)] = 1;
  }
  for (i = 0; i < SEGMENTS.length; i++){
    var cells = segmentCells(SEGMENTS[i]);
    for (var j = 0; j < cells.length; j++) fixed[key(cells[j][0], cells[j][1])] = 1;
  }
  var minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9;
  for (k in floor){
    var cr = unkey(k), p = hexCenter(cr[0], cr[1]);
    if (p.x < minx) minx = p.x; if (p.x > maxx) maxx = p.x;
    if (p.y < miny) miny = p.y; if (p.y > maxy) maxy = p.y;
  }
  BOUNDS = {minx: minx - 0.5, maxx: maxx + 0.5, miny: miny - 0.6, maxy: maxy + 0.6};
})();
var FLOOR_N = Object.keys(floor).length, FIXED_N = Object.keys(fixed).length;

/* --- a layout, as a value ------------------------------------------------ */

/* Only the tiles the user turned black are stored; the border is in the
   program, so a layout is a name and a list of cell keys. `past` is the undo
   stack, previous cell lists, newest last. */
function blankLayout(){
  return {id:null, name:"", created:null, updated:null, cells:[], past:[]};
}
function paintable(c, r){
  var k = key(c, r);
  return !!floor[k] && !fixed[k];
}
function withCells(L, cells, cont){
  var past = cont ? L.past : L.past.concat([L.cells]);
  if (past.length > 200) past = past.slice(past.length - 200);
  return {id:L.id, name:L.name, created:L.created, updated:L.updated, cells:cells, past:past};
}
function toggleCell(L, c, r){
  if (!paintable(c, r)) return L;
  var k = key(c, r), i = L.cells.indexOf(k);
  var cells = i >= 0 ? L.cells.slice(0, i).concat(L.cells.slice(i + 1)) : L.cells.concat([k]);
  return withCells(L, cells, false);
}
/* Paint sets rather than flips, so a brush passing twice over a tile leaves it
   the colour asked for. `cont` continues a stroke: no new undo step. */
function paintCell(L, c, r, black, cont){
  if (!paintable(c, r)) return L;
  var k = key(c, r), i = L.cells.indexOf(k);
  if (black && i >= 0) return L;
  if (!black && i < 0) return L;
  var cells = black ? L.cells.concat([k]) : L.cells.slice(0, i).concat(L.cells.slice(i + 1));
  return withCells(L, cells, cont);
}
function undo(L){
  if (!L.past.length) return L;
  return {id:L.id, name:L.name, created:L.created, updated:L.updated,
    cells:L.past[L.past.length - 1], past:L.past.slice(0, L.past.length - 1)};
}
function counts(L){
  var black = FIXED_N + L.cells.length;
  return {black: black, white: FLOOR_N - black, fixed: FIXED_N, user: L.cells.length};
}
function serialize(L){
  return {id:L.id, name:L.name, created:L.created, updated:L.updated, cells:L.cells.slice()};
}
/* Anything that is not a paintable tile is dropped on the way in, so a layout
   saved against an older reading of the floor cannot paint a wall. */
function deserialize(o){
  var L = blankLayout(), seen = {};
  if (!o) return L;
  L.id = o.id || null; L.name = typeof o.name === "string" ? o.name : "";
  L.created = o.created || null; L.updated = o.updated || null;
  var src = Array.isArray(o.cells) ? o.cells : [];
  for (var i = 0; i < src.length; i++){
    var k = String(src[i]);
    if (!/^-?\d+,-?\d+$/.test(k) || seen[k]) continue;
    var cr = unkey(k);
    if (!paintable(cr[0], cr[1])) continue;
    seen[k] = 1; L.cells.push(k);
  }
  return L;
}
function newId(now){
  return "L" + now.toString(36) + Math.floor(Math.random() * 1e6).toString(36);
}
function untitled(layouts){
  var n = layouts.length + 1, names = {};
  for (var i = 0; i < layouts.length; i++) names[layouts[i].name] = 1;
  while (names["Layout " + n]) n++;
  return "Layout " + n;
}

/* --- the view transform, as a value -------------------------------------- */

/* screen = hex * scale + t. Fit leaves a little air around the floor. */
function fitView(w, h){
  var bw = BOUNDS.maxx - BOUNDS.minx, bh = BOUNDS.maxy - BOUNDS.miny, pad = 14;
  var scale = Math.min((w - pad * 2) / bw, (h - pad * 2) / bh);
  if (!(scale > 0)) scale = 1;
  return {scale: scale, tx: (w - bw * scale) / 2 - BOUNDS.minx * scale, ty: (h - bh * scale) / 2 - BOUNDS.miny * scale};
}
function zoomAt(v, factor, x, y, w, h){
  var s = v.scale * factor, lo = fitView(w, h).scale * 0.5, hi = 90;
  if (s < lo) s = lo; if (s > hi) s = hi;
  var f = s / v.scale;
  return {scale: s, tx: x - (x - v.tx) * f, ty: y - (y - v.ty) * f};
}
function panBy(v, dx, dy){ return {scale: v.scale, tx: v.tx + dx, ty: v.ty + dy}; }
function toHex(v, x, y){ return hexAt((x - v.tx) / v.scale, (y - v.ty) / v.scale); }

/* ============================== STORAGE ============================== */

var KEY = "hex-floor-v1";
var memory = null;

function blank(){ return {layouts:[], draft:blankLayout()}; }
function loadState(){
  try {
    var raw = localStorage.getItem(KEY);
    if (raw){
      var s = JSON.parse(raw), out = blank();
      var ls = Array.isArray(s.layouts) ? s.layouts : [];
      for (var i = 0; i < ls.length; i++){
        var L = deserialize(ls[i]);
        if (L.id) out.layouts.push(serialize(L));
      }
      out.draft = deserialize(s.draft);
      return out;
    }
  } catch (e) { /* storage blocked — fall through */ }
  return memory || blank();
}
function saveState(){
  memory = state;
  try {
    localStorage.setItem(KEY, JSON.stringify({layouts: state.layouts, draft: serialize(state.draft)}));
  } catch (e) {}
}

/* ============================== STATE ============================== */

var state = loadState();
var tab = "design";
var view = null;            /* {scale, tx, ty}, null until the canvas has a size */
var brush = false, paintBlack = true;
var renaming = null, confirmDel = null;
var pointers = {}, gesture = null;

function savedOf(L){
  for (var i = 0; i < state.layouts.length; i++) if (state.layouts[i].id === L.id) return state.layouts[i];
  return null;
}
function isDirty(){
  var s = savedOf(state.draft);
  if (!s) return state.draft.cells.length > 0 || state.draft.name !== "";
  return s.cells.join("|") !== state.draft.cells.join("|") || s.name !== state.draft.name;
}
function commitDraft(asNew, now){
  var L = state.draft, s = asNew ? null : savedOf(L);
  var name = (L.name || "").trim() || (s ? s.name : untitled(state.layouts));
  if (s){
    s.name = name; s.cells = L.cells.slice(); s.updated = now;
  } else {
    s = {id: newId(now), name: name, created: now, updated: now, cells: L.cells.slice()};
    state.layouts.push(s);
  }
  state.draft = {id: s.id, name: name, created: s.created, updated: now, cells: L.cells.slice(), past: L.past};
  saveState();
}
function openLayout(id){
  var s = null;
  for (var i = 0; i < state.layouts.length; i++) if (state.layouts[i].id === id) s = state.layouts[i];
  if (!s) return;
  state.draft = deserialize(s);
  saveState();
}

/* ============================== VIEWS ============================== */

function esc(s){
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function fmtDate(t){
  if (!t) return "";

    d.toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"});
}

function viewFor(t){
  return t === "layouts" ? viewLayouts() : (t === "plan" ? viewPlan() : viewDesign());
}

/* ============================== RENDER ============================== */

var raf = 0;

function render(){
  var app = document.getElementById("app");
  app.innerHTML = viewHeader() + viewFor(tab) + viewNav();
  if (tab === "design") mountCanvas();
  else if (tab === "layouts") paintPreviews();
  var box = document.getElementById("install");
  if (box && deferredPrompt) box.style.display = "block";
}

/* The stage canvas is rebuilt with every render, so it is sized and wired here.
   The view transform survives across renders; only a first paint fits it. */
function mountCanvas(){
  var cv = document.getElementById("floor");
  if (!cv) return;
  sizeCanvas(cv);
  if (!view) view = fitView(cv.clientWidth, cv.clientHeight);
  bindPointer(cv);
  paint();
}
function sizeCanvas(cv){
  var dpr = window.devicePixelRatio || 1;
  var w = cv.clientWidth || 320, h = cv.clientHeight || 400;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
}
function paint(){
  if (raf) return;
  raf = requestAnimationFrame(function(){ raf = 0; paintFloor(); });
}

/* Everything on screen is drawn from scratch each frame, but as five batched
   paths rather than a path per tile, which is what keeps a pan smooth with
   fourteen thousand cells in view. Grout is the floor's background showing
   between tiles drawn at nine tenths. */
function paintFloor(){
  var cv = document.getElementById("floor");
  if (!cv || !view) return;
  var ctx = cv.getContext("2d"), dpr = window.devicePixelRatio || 1;
  var w = cv.clientWidth || 320, h = cv.clientHeight || 400;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#0b0f14"; ctx.fillRect(0, 0, w, h);
  drawCells(ctx, view, w, h, state.draft, {labels: true, rings: true, grout: true});
  var el = document.getElementById("counts");
  if (el) el.innerHTML = countsText(counts(state.draft));
}

function drawCells(ctx, v, w, h, L, opts){
  var s = v.scale, user = {}, i, k, cr, p;
  for (i = 0; i < L.cells.length; i++) user[L.cells[i]] = 1;
  var r0 = Math.floor((0 - v.ty) / s / HEX_H) - 1, r1 = Math.ceil((h - v.ty) / s / HEX_H) + 1;
  var c0 = Math.floor((0 - v.tx) / s) - 1, c1 = Math.ceil((w - v.tx) / s) + 1;
  var grout = opts.grout && s > 3.5, tile = grout ? 0.9 : 1.0;
  var groutPath = [], white = [], black = [], fix = [];
  for (var r = r0; r <= r1; r++){
    for (var c = c0; c <= c1; c++){
      k = key(c, r);
      if (!floor[k]) continue;
      p = hexCenter(c, r);
      var x = p.x * s + v.tx, y = p.y * s + v.ty;
      if (grout) groutPath.push(x, y);
      if (fixed[k]) fix.push(x, y);
      else if (user[k]) black.push(x, y);
      else white.push(x, y);
    }
  }
  if (grout){ ctx.fillStyle = "#6b6f73"; fillHexes(ctx, groutPath, s); }
  ctx.fillStyle = "#f4f4f2"; fillHexes(ctx, white, s * tile);
  ctx.fillStyle = "#151515"; fillHexes(ctx, black, s * tile);
  ctx.fillStyle = "#151515"; fillHexes(ctx, fix, s * tile);
  if (opts.rings && s >= 7){
    ctx.strokeStyle = "#f5c542"; ctx.lineWidth = Math.max(1, s * 0.07);
    ctx.beginPath();
    for (i = 0; i < fix.length; i += 2){ ctx.moveTo(fix[i] + s * 0.22, fix[i + 1]); ctx.arc(fix[i], fix[i + 1], s * 0.22, 0, Math.PI * 2); }
    ctx.stroke();
  }
  if (opts.labels && s >= 2.2){
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (i = 0; i < LABELS.length; i++){
      var lb = LABELS[i], q = hexCenter(lb.c, lb.r);
      ctx.fillStyle = lb.light ? "rgba(255,255,255,0.5)" : "rgba(20,24,30,0.45)";
      var fs = Math.max(10, Math.min(18, s * (lb.small ? 1.4 : 2.2)));
      ctx.font = "800 " + fs + "px -apple-system,system-ui,sans-serif";
      var lx = q.x * s + v.tx, ly = q.y * s + v.ty;
      if (lb.rot){ ctx.save(); ctx.translate(lx, ly); ctx.rotate(-Math.PI / 2); ctx.fillText(lb.t, 0, 0); ctx.restore(); }
      else ctx.fillText(lb.t, lx, ly);
    }
  }
}
function fillHexes(ctx, pts, w){
  if (!pts.length) return;
  ctx.beginPath();
  for (var i = 0; i < pts.length; i += 2){
    var k = hexCorners(pts[i], pts[i + 1], w);
    ctx.moveTo(k[0], k[1]);
    for (var j = 2; j < 12; j += 2) ctx.lineTo(k[j], k[j + 1]);
    ctx.closePath();
  }
  ctx.fill();
}

/* Thumbnails on the Layouts tab: the whole floor squeezed into a card, walls
   dark, no grout, no rings. */
function paintPreviews(){
  var cvs = document.querySelectorAll("canvas[data-pv]");
  for (var i = 0; i < cvs.length; i++){
    var cv = cvs[i], id = cv.dataset.pv, L = null;
    for (var j = 0; j < state.layouts.length; j++) if (state.layouts[j].id === id) L = state.layouts[j];
    if (!L) continue;
    var ctx = cv.getContext("2d"), w = cv.width, h = cv.height;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = "#0b0f14"; ctx.fillRect(0, 0, w, h);
    drawCells(ctx, fitView(w, h), w, h, L, {labels: false, rings: false, grout: false});
  }
}

/* A PNG of the whole plan at a fixed size, for sending to whoever lays it. */
function exportImage(){
  try {
    var cv = document.createElement("canvas");
    var s = 14, bw = BOUNDS.maxx - BOUNDS.minx, bh = BOUNDS.maxy - BOUNDS.miny;
    cv.width = Math.ceil(bw * s + 40); cv.height = Math.ceil(bh * s + 40);
    var ctx = cv.getContext("2d");
    ctx.fillStyle = "#0b0f14"; ctx.fillRect(0, 0, cv.width, cv.height);
    var v = {scale: s, tx: 20 - BOUNDS.minx * s, ty: 20 - BOUNDS.miny * s};
    drawCells(ctx, v, cv.width, cv.height, state.draft, {labels: true, rings: true, grout: true});
    var a = document.createElement("a");
    a.href = cv.toDataURL("image/png");
    a.download = ((state.draft.name || "hex-floor").replace(/[^\w\- ]+/g, "") || "hex-floor") + ".png";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  } catch (e) {}
}

/* ============================== ACTIONS ============================== */

document.addEventListener("click", function(e){
  var t = e.target.closest ? e.target.closest("[data-a]") : null;
  if (!t) return;
  var a = t.dataset.a, id = t.dataset.id, now = Date.now();
  if (a === "tab"){ tab = t.dataset.t; renaming = null; confirmDel = null; render(); return; }
  if (a === "save"){ commitDraft(false, now); render(); return; }
  if (a === "saveas"){ commitDraft(true, now); render(); return; }
  if (a === "new"){ state.draft = blankLayout(); saveState(); render(); return; }
  if (a === "tap"){ brush = false; render(); return; }
  if (a === "brush"){ brush = true; render(); return; }
  if (a === "black"){ paintBlack = true; render(); return; }
  if (a === "white"){ paintBlack = false; render(); return; }
  if (a === "undo"){ state.draft = undo(state.draft); saveState(); render(); return; }
  if (a === "fit"){ var cv = document.getElementById("floor"); view = fitView(cv ? cv.clientWidth : 320, cv ? cv.clientHeight : 400); paint(); return; }
  if (a === "image"){ exportImage(); return; }
  if (a === "open"){ openLayout(id); tab = "design"; render(); return; }
  if (a === "dup"){
    var src = null;
    for (var i = 0; i < state.layouts.length; i++) if (state.layouts[i].id === id) src = state.layouts[i];
    if (src){
      state.layouts.push({id: newId(now), name: src.name + " copy", created: now, updated: now, cells: src.cells.slice()});
      saveState();
    }
    render(); return;
  }
  if (a === "rename"){ renaming = id; confirmDel = null; render(); return; }
  if (a === "renameok"){
    var val = renameVal;
    for (var j = 0; j < state.layouts.length; j++) if (state.layouts[j].id === id && val != null && val.trim()){
      state.layouts[j].name = val.trim();
      if (state.draft.id === id) state.draft.name = val.trim();
    }
    renaming = null; renameVal = null; saveState(); render(); return;
  }
  if (a === "del"){ confirmDel = id; renaming = null; render(); return; }
  if (a === "delno"){ confirmDel = null; render(); return; }
  if (a === "delok"){
    state.layouts = state.layouts.filter(function(L){ return L.id !== id; });
    if (state.draft.id === id) state.draft.id = null;
    confirmDel = null; saveState(); render(); return;
  }
  if (a === "install" && deferredPrompt){ deferredPrompt.prompt(); deferredPrompt = null; return; }
});

/* Typing never re-renders: the name field is written straight into the draft
   and saved, and the rename box is read back when OK is tapped. */
var renameVal = null;
document.addEventListener("input", function(e){
  var t = e.target, f = t && t.dataset ? t.dataset.f : null;
  if (f === "name"){
    state.draft.name = t.value; saveState();
    var hs = document.getElementById("hsub");
    if (hs) hs.innerHTML = (t.value ? esc(t.value) : "<span>Untitled</span>") + (isDirty() ? ' <span class="dirty">•</span>' : "");
  }
  if (f === "rename"){ renameVal = t.value; }
});

/* --- the canvas ---------------------------------------------------------- */

/* One finger: a tap flips a tile, a drag moves the view, or paints in brush
   mode. Two fingers pinch. A tap is a press that never travelled, so a shaky
   finger that moved a few pixels still flips its tile. */
function bindPointer(cv){
  var TAP = 8;
  function pt(e){
    var r = cv.getBoundingClientRect();
    return {x: e.clientX - r.left, y: e.clientY - r.top};
  }
  function ids(){ return Object.keys(pointers); }
  function paintAt(p, cont){
    var cr = toHex(view, p.x, p.y);
    var next = paintCell(state.draft, cr[0], cr[1], paintBlack, cont);
    if (next !== state.draft){ state.draft = next; saveState(); paint(); }
  }
  cv.addEventListener("pointerdown", function(e){
    if (e.button != null && e.button !== 0) return;
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (x) {}
    var p = pt(e);
    pointers[e.pointerId] = {x: p.x, y: p.y, x0: p.x, y0: p.y};
    var n = ids().length;
    if (n === 1){
      gesture = brush ? {type: "paint", moved: false, first: true} : {type: "tap", moved: false};
      if (brush){ paintAt(p, false); gesture.first = false; }
    } else if (n === 2){
      var a = pointers[ids()[0]], b = pointers[ids()[1]];
      gesture = {type: "pinch", d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, v0: view,
        cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2};
    }
  });
  cv.addEventListener("pointermove", function(e){
    var q = pointers[e.pointerId];
    if (!q || !gesture) return;
    e.preventDefault();
    var p = pt(e), dx = p.x - q.x, dy = p.y - q.y;
    q.x = p.x; q.y = p.y;
    if (gesture.type === "pinch"){
      var a = pointers[ids()[0]], b = pointers[ids()[1]];
      if (!a || !b) return;
      var d = Math.hypot(a.x - b.x, a.y - b.y) || 1, cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
      var z = zoomAt(gesture.v0, d / gesture.d0, gesture.cx, gesture.cy, cv.clientWidth, cv.clientHeight);
      view = panBy(z, cx - gesture.cx, cy - gesture.cy);
      paint(); return;
    }
    if (gesture.type === "paint"){ paintAt(p, true); return; }
    if (!gesture.moved && Math.hypot(p.x - q.x0, p.y - q.y0) > TAP) gesture.moved = true;
    if (gesture.moved){ view = panBy(view, dx, dy); paint(); }
  });
  function up(e){
    var q = pointers[e.pointerId];
    if (!q) return;
    if (gesture && gesture.type === "tap" && !gesture.moved && ids().length === 1){
      var cr = toHex(view, q.x, q.y);
      var next = toggleCell(state.draft, cr[0], cr[1]);
      if (next !== state.draft){ state.draft = next; saveState(); paint(); syncUndo(); }
    }
    delete pointers[e.pointerId];
    if (!ids().length) gesture = null;
    else if (gesture && gesture.type === "pinch") gesture = {type: "tap", moved: true};
    try { cv.releasePointerCapture(e.pointerId); } catch (x) {}
  }
  cv.addEventListener("pointerup", up);
  cv.addEventListener("pointercancel", up);
  cv.addEventListener("wheel", function(e){
    e.preventDefault();
    var p = pt(e), f = Math.pow(1.0015, -e.deltaY);
    view = zoomAt(view, f, p.x, p.y, cv.clientWidth, cv.clientHeight);
    paint();
  }, {passive: false});
}
/* The Undo button's enabled state is painted by hand after a tap, the same
   way the counts are: a full render would rebuild the canvas under the finger. */
function syncUndo(){
  var b = document.querySelector('[data-a="undo"]');
  if (b) b.disabled = !state.draft.past.length;
}

window.addEventListener("resize", function(){
  var cv = document.getElementById("floor");
  if (!cv) return;
  sizeCanvas(cv); paint();
});

  e.preventDefault(); deferredPrompt = e;
  var box = document.getElementById("install");
  if (box) box.style.display = "block";
});
