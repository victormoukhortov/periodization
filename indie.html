<style>
  :root{
    --bg:#0a0a0a; --card:#171717; --line:#262626; --ink:#f5f5f5;
    --muted:#a3a3a3; --dim:#737373; --go:#34d399; --go-deep:#059669;
    --deload:#38bdf8; --ask:#ef4444;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    font-size:16px;line-height:1.45;
    padding-bottom:calc(76px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:contain;
  }
  h1,h2,h3{margin:0;letter-spacing:-0.02em}
  p{margin:0}
  button,input{font:inherit;color:inherit}
  button{background:none;border:none;padding:0;cursor:pointer}
  .wrap{padding:20px 16px}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .muted{color:var(--muted)}
  .dim{color:var(--dim)}
  .eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:var(--dim)}

  /* header */
  header{position:sticky;top:0;z-index:20;background:rgba(10,10,10,.96);
    backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
    padding:calc(14px + env(safe-area-inset-top)) 16px 12px}
  .htop{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .htop h1{font-size:26px;font-weight:900}
  .htop h1 span{color:var(--dim)}
  .htop h1 em{font-style:normal;color:var(--deload)}
  .rail{display:flex;gap:4px;margin-top:12px}
  .rail i{height:4px;flex:1;border-radius:99px;background:var(--line)}
  .rail i.done{background:#065f46}
  .rail i.now{background:var(--go)}
  .rail i.dl{background:#0c4a6e}
  .rail i.peek{background:var(--ink)}

  /* blocks */
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px}
  .tag{display:inline-flex;align-items:center;gap:7px;border:1px solid color-mix(in srgb,var(--c) 35%,transparent);
    background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);
    border-radius:6px;padding:3px 9px 3px 7px;font-size:11px;font-weight:800;
    text-transform:uppercase;letter-spacing:.12em}
  .tag b{display:flex;gap:2px}
  .tag b s{display:block;width:2px;height:11px;background:currentColor;border-radius:2px;text-decoration:none}
  .tag b s:nth-child(2){opacity:.65} .tag b s:nth-child(3){opacity:.35}

  .list>div{padding:12px 14px;border-top:1px solid var(--line)}
  .list>div:first-child{border-top:none}
  .rowline{display:flex;justify-content:space-between;gap:12px;align-items:center}
  .rowline .name{font-size:14px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .btn{display:block;width:100%;border-radius:14px;padding:16px;font-size:16px;font-weight:800;text-align:center}
  .btn.go{background:var(--go);color:#062a1c}
  .btn.go:active{background:var(--go-deep)}
  .btn.ghost{background:#262626;color:var(--ink)}
  .btn[disabled]{background:#1c1c1c;color:#525252}
  .chip{border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--muted)}
  .chip.on{border-color:var(--go);background:var(--go);color:#062a1c}
  .chip[disabled]{opacity:.3}
  .vid{display:inline-flex;align-items:center;justify-content:center;width:36px;height:30px;
    border:1px solid var(--line);border-radius:99px;color:var(--muted);text-decoration:none}
  .vid:active{color:var(--ink);border-color:var(--muted)}
  .cell-day{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 4px;text-align:center}
  .cell-day.now{border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.08)}
  .cell-day.peek{border-color:var(--ink)}
  .cell-day.past{opacity:.35}

  /* exercise */
  .ex{background:var(--card);padding:18px 16px;margin-bottom:8px}
  .exhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .ex h3{font-size:18px;font-weight:800;line-height:1.2}
  .target{margin-top:8px;font-family:var(--mono);font-size:13px;color:var(--go);display:flex;gap:8px;flex-wrap:wrap}
  .target b{color:var(--ink);font-weight:700}
  .why{margin-top:10px;background:#262626;border-radius:10px;padding:12px;font-size:14px;color:#d4d4d4}
  .grid{display:grid;grid-template-columns:26px 1fr 1fr 52px;gap:8px;align-items:center}
  .grid .eyebrow{text-align:center}
  .cell{width:100%;background:var(--bg);border:1px solid #333;border-radius:10px;
    padding:11px 4px;text-align:center;font-family:var(--mono);font-size:17px;
    font-variant-numeric:tabular-nums}
  .cell:focus{outline:none;border-color:var(--go)}
  .cell.need{border-color:var(--ask)}
  .cell::placeholder{color:#525252}
  .log{height:44px;border:1px solid #333;border-radius:10px;background:var(--bg);
    color:#525252;font-size:18px;font-weight:800}
  .log.on{background:var(--go-deep);border-color:var(--go);color:#fff}
  .rir{display:flex;gap:6px;margin-top:8px}
  .rir button{flex:1;height:38px;border:1px solid #333;border-radius:10px;background:var(--bg);
    color:var(--muted);font-family:var(--mono);font-size:14px}
  .rir button.on{background:var(--go);border-color:var(--go);color:#062a1c}

  /* feedback */
  .fb{background:#171717;min-height:100vh;padding:24px 20px calc(120px + env(safe-area-inset-bottom))}
  .fb h2{font-size:36px;font-weight:900}
  .fb h3{font-size:19px;font-weight:700;text-transform:capitalize;margin-top:22px}
  .fb .q{color:var(--muted);font-size:14px;margin:4px 0 10px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .opts button{border:1px solid rgba(239,68,68,.4);background:rgba(239,68,68,.1);
    border-radius:10px;padding:13px 8px;font-size:14px;font-weight:700;line-height:1.2}
  .opts button.on{background:var(--ask);border-color:#f87171;color:#fff}
  .rule{height:1px;background:var(--line);margin:26px 0 0}

  /* mid-session question sheet */
  .scrim{position:fixed;inset:0;z-index:40;background:rgba(10,10,10,.75);
    backdrop-filter:blur(3px);display:flex;align-items:flex-end}
  .sheet{width:100%;max-height:88vh;overflow-y:auto;background:var(--card);
    border-top:1px solid var(--line);border-radius:18px 18px 0 0;
    padding:20px 20px calc(24px + env(safe-area-inset-bottom))}
  .sheet h3{font-size:18px;font-weight:700;text-transform:capitalize;margin-top:18px}
  .sheet .q{color:var(--muted);font-size:14px;margin:4px 0 10px}
  .save{background:var(--ask);color:#fff;border-radius:10px;padding:13px 30px;font-size:17px;font-weight:800}
  .save[disabled]{background:#262626;color:#525252}

  /* nav */
  nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);
    background:rgba(23,23,23,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom)}
  nav button{padding:14px 0;font-size:11px;font-weight:800;text-transform:uppercase;
    letter-spacing:.1em;color:var(--dim)}
  nav button.on{color:var(--go)}

  .stack>*+*{margin-top:8px}
  .mt{margin-top:20px}
  .center{text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>

<script>
"use strict";

/* ============================== PROGRAM ============================== */

var DAYS = [
  { id:"push", name:"Push", exercises:[
    {id:"p1",name:"Bench Press",gear:"Barbell",muscle:"chest",sets:4,lo:5,hi:8},
    {id:"p2",name:"Overhead Press",gear:"Barbell",muscle:"delts",sets:3,lo:6,hi:10},
    {id:"p3",name:"Incline Dumbbell Press",gear:"Dumbbell",muscle:"chest",sets:3,lo:8,hi:12},
    {id:"p4",name:"Cable Lateral Raise",gear:"Cable",muscle:"delts",sets:3,lo:12,hi:15},
    {id:"p5",name:"Overhead Triceps Extension",gear:"EZ Bar",muscle:"triceps",sets:3,lo:10,hi:12},
    {id:"p6",name:"Triceps Pushdown",gear:"Cable",muscle:"triceps",sets:2,lo:12,hi:15}
  ]},
  { id:"pull", name:"Pull", exercises:[
    {id:"l7",name:"Lat Pulldown",gear:"Cable",muscle:"back",sets:4,lo:6,hi:10},
    {id:"l2",name:"Barbell Row",gear:"Barbell",muscle:"back",sets:3,lo:6,hi:10},
    {id:"l3",name:"Seated Cable Row",gear:"Cable",muscle:"back",sets:3,lo:10,hi:12},
    {id:"l4",name:"Face Pull",gear:"Cable",muscle:"rear delts",sets:3,lo:15,hi:20},
    {id:"l5",name:"Incline Dumbbell Curl",gear:"Dumbbell",muscle:"biceps",sets:3,lo:8,hi:12},
    {id:"l6",name:"Hammer Curl",gear:"Dumbbell",muscle:"biceps",sets:2,lo:10,hi:12}
  ]},
  { id:"legs", name:"Legs", exercises:[
    {id:"g7",name:"Leg Press",gear:"Machine",muscle:"quads",sets:4,lo:5,hi:8,lower:true},
    {id:"g2",name:"Romanian Deadlift",gear:"Barbell",muscle:"hamstrings",sets:3,lo:8,hi:10,lower:true},
    {id:"g3",name:"Bulgarian Split Squat",gear:"Dumbbell",muscle:"quads",sets:3,lo:8,hi:10},
    {id:"g4",name:"Seated Leg Curl",gear:"Machine",muscle:"hamstrings",sets:3,lo:10,hi:12},
    {id:"g5",name:"Standing Calf Raise",gear:"Machine",muscle:"calves",sets:4,lo:10,hi:15},
    {id:"g6",name:"Hanging Leg Raise",gear:"Bodyweight",muscle:"abs",sets:3,lo:10,hi:15,bw:true}
  ]},
  { id:"full", name:"Full Body", exercises:[
    {id:"f1",name:"Deadlift",gear:"Barbell",muscle:"hamstrings",sets:3,lo:3,hi:5,lower:true},
    {id:"f2",name:"Dips",gear:"Bodyweight",muscle:"chest",sets:3,lo:8,hi:12,bw:true},
    {id:"f3",name:"Neutral-Grip Pulldown",gear:"Cable",muscle:"back",sets:3,lo:10,hi:12},
    {id:"f9",name:"Hack Squat",gear:"Machine",muscle:"quads",sets:3,lo:12,hi:15,lower:true},
    {id:"f5",name:"Dumbbell Lateral Raise",gear:"Dumbbell",muscle:"delts",sets:3,lo:12,hi:15},
    {id:"f6",name:"Cable Curl",gear:"Cable",muscle:"biceps",sets:2,lo:10,hi:12},
    {id:"f7",name:"Rope Pushdown",gear:"Cable",muscle:"triceps",sets:2,lo:10,hi:12},
    {id:"f8",name:"Plank",gear:"Bodyweight",muscle:"abs",sets:3,lo:30,hi:60,time:true}
  ]}
];

/* Five weeks: four of work, then a deload. Everything about the shape of the
   block derives from these three, so there is one place to change it. */
/* Dropped from the program but still sitting in people's logs. Progress reads
   this so a retired lift keeps its curve. Never put one of these ids back on a
   day — the log would resume under a movement it was never trained on. */
var RETIRED = [
  {id:"g1",name:"Back Squat",gear:"Barbell",muscle:"quads",sets:4,lo:5,hi:8,lower:true},
  {id:"l1",name:"Pull-Up",gear:"Bodyweight",muscle:"back",sets:4,lo:6,hi:10,bw:true},
  {id:"f4",name:"Leg Press",gear:"Machine",muscle:"quads",sets:3,lo:12,hi:15,lower:true}
];

var WEEKS_PER_BLOCK = 5;
var DELOAD_WEEK = 5;
var SESSIONS_PER_BLOCK = DAYS.length * WEEKS_PER_BLOCK;
var RIR_BY_WEEK = {1:3, 2:2, 3:1, 4:0, 5:5};
var BAR = 45, PLATES = [45,35,25,10,5,2.5];

var HUE = {chest:"#fb7185", back:"#38bdf8", delts:"#fbbf24", "rear delts":"#fbbf24",
  triceps:"#e879f9", biceps:"#a78bfa", quads:"#34d399", hamstrings:"#2dd4bf",
  calves:"#a3e635", abs:"#fb923c"};

var SORENESS = ["Never got sore","Healed a while ago","Healed just on time","I'm still sore!"];
var PUMP = ["Low pump","Moderate pump","Amazing pump"];
var WORKLOAD = ["Not enough","Just right","Pushed my limits","Too much"];

/* What each week of the block is for, shown on the Plan screen. */
var WEEK_COPY = {
  1: "Sets come from last block’s feedback. Loads pick up where you left off.",
  2: "One notch harder: same sets plus whatever feedback added, one more rep or one more pair of plates.",
  3: "Sets are near their peak and so is fatigue. Keep one rep in the tank on the last set.",
  4: "The heaviest week. Take the last set of each exercise to the point where the next rep will not move.",
  5: "Half the sets, 60% load, no feedback. Injected automatically so you don’t have to remember."
};

/* ============================== ENGINE ============================== */

function weekOf(i){ return Math.floor(i / DAYS.length) + 1; }
function dayOf(i){ return DAYS[i % DAYS.length]; }
function isDeload(i){ return weekOf(i) >= DELOAD_WEEK; }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function fmt(n){ return n == null ? "\u2014" : (Number(n) % 1 === 0 ? String(n) : Number(n).toFixed(1)); }
function stepFor(ex){ return ex.lower ? 10 : 5; }

function roundLoad(ex, w){
  if (w == null) return null;
  if (w <= 0) return 0;
  var v = Math.round(w / 5) * 5;
  return ex.gear === "Barbell" ? Math.max(BAR, v) : Math.max(5, v);
}

function platesPerSide(total){
  var per = (total - BAR) / 2, out = [];
  if (per < 2.5) return null;
  PLATES.forEach(function(p){
    while (per >= p - 0.001){ out.push(p % 1 === 0 ? p : p.toFixed(1)); per -= p; }
  });
  return out.length ? out.join(" \u00b7 ") : null;
}

/* set change for one muscle from soreness / pump / workload */
function setsDelta(fb){
  if (!fb) return 0;
  if (fb.v === 3) return -1;
  if (fb.s === 3) return fb.v >= 2 ? -1 : 0;
  if (fb.v === 2) return 0;
  var d = fb.s === 2 ? 1 : 2;
  if (fb.v === 0) d += 1;
  if (fb.p === 0) d += 1;
  if (fb.p === 2) d -= 1;
  return clamp(d, 0, 3);
}

function reasonForDelta(fb, d){
  if (!fb) return "No feedback logged \u2014 sets held.";
  if (fb.v === 3) return "Volume was too much \u2014 cutting a set.";
  if (fb.s === 3) return d < 0 ? "Still sore and volume was high \u2014 cutting a set." : "Still sore \u2014 holding sets to let it recover.";
  if (fb.v === 2) return "You pushed your limits \u2014 that's the right dose, holding sets.";
  var bits = [["never got sore","soreness healed early","soreness healed on time"][fb.s]];
  if (fb.v === 0) bits.push("volume felt light");
  if (fb.p === 0) bits.push("low pump");
  if (fb.p === 2) bits.push("pump was already strong");
  return bits.join(", ") + " \u2192 +" + d + " set" + (d === 1 ? "" : "s") + ".";
}

function applyDelta(counts, exs, delta){
  if (!exs || !exs.length) return;
  function total(){ return exs.reduce(function(a,e){ return a + counts[e.id]; }, 0); }
  var d = delta, t;
  while (d > 0 && total() < 10){
    t = exs.reduce(function(a,b){ return counts[a.id] <= counts[b.id] ? a : b; });
    if (counts[t.id] >= 6) break;
    counts[t.id] += 1; d--;
  }
  while (d < 0 && total() > exs.length){
    t = exs.reduce(function(a,b){ return counts[a.id] >= counts[b.id] ? a : b; });
    if (counts[t.id] <= 1) break;
    counts[t.id] -= 1; d++;
  }
}

function setCountsForDay(dayId, history){
  var day = DAYS.filter(function(d){ return d.id === dayId; })[0];
  var counts = {};
  day.exercises.forEach(function(e){ counts[e.id] = e.sets; });
  history.filter(function(h){ return h.dayId === dayId && !h.deload; }).forEach(function(h){
    Object.keys(h.feedback || {}).forEach(function(m){
      var exs = day.exercises.filter(function(e){ return e.muscle === m; });
      applyDelta(counts, exs, setsDelta(h.feedback[m]));
    });
  });
  return counts;
}

function lastPerformance(exId, history){
  for (var i = history.length - 1; i >= 0; i--){
    var h = history[i];
    if (h.deload) continue;
    var rows = (h.sets || {})[exId];
    if (!rows) continue;
    var done = rows.filter(function(r){ return r.done && Number(r.r) > 0; });
    if (!done.length) continue;
    var w = Math.max.apply(null, done.map(function(r){ return Number(r.w) || 0; }));
    var atTop = done.filter(function(r){ return (Number(r.w) || 0) === w; });
    return {
      weight: w,
      bestReps: Math.max.apply(null, atTop.map(function(r){ return Number(r.r); })),
      rir: (h.rir && h.rir[exId] != null) ? h.rir[exId] : null
    };
  }
  return null;
}

function prescribe(ex, idx, history, lastSore){
  var week = weekOf(idx), dl = isDeload(idx);
  var last = lastPerformance(ex.id, history), step = stepFor(ex);

  if (ex.time){
    var base = last ? last.bestReps : ex.lo;
    if (dl) return {weight:0, reps:Math.max(ex.lo, Math.round(base * 0.6)), why:"Deload \u2014 hold about 60% of your usual time."};
    if (!last) return {weight:0, reps:ex.lo, why:"First time \u2014 start at 30s and build."};
    return {weight:0, reps:base + 5, why:"Last time " + base + "s \u2014 add 5s."};
  }
  /* Bodyweight movements carry no load, ever. There is nothing to add plates
     to, so the only thing that can go up is reps, and it keeps going up past
     the top of the range rather than stalling there waiting for a belt. */
  if (ex.bw){
    if (dl) return {weight:0, reps:ex.lo, why:"Deload \u2014 half the sets, back to " + ex.lo + " easy reps."};
    if (!last) return {weight:0, reps:ex.lo, why:"First time in. Bodyweight only \u2014 get " + ex.lo + " clean reps."};
    if (lastSore === 3) return {weight:0, reps:last.bestReps, why:"You were still sore going in last time \u2014 repeat " + last.bestReps + " instead of adding."};
    if (last.rir === 0 && week === 1) return {weight:0, reps:last.bestReps, why:"You hit failure last time and it's only week 1 \u2014 repeat, don't chase."};
    return {weight:0, reps:last.bestReps + 1, why:"Last time " + last.bestReps + " reps \u2014 add one. Bodyweight keeps climbing in reps."};
  }
  if (!last){
    return {weight:null, reps:ex.lo,
      why:"First time in. Pick a load you could stop " + RIR_BY_WEEK[week] + " reps short of failure at " + ex.lo + "\u2013" + ex.hi + " reps."};
  }
  if (dl){
    return {weight: last.weight > 0 ? roundLoad(ex, last.weight * 0.6) : 0, reps: ex.lo,
      why:"Deload \u2014 about 60% of " + fmt(last.weight) + " lb, half the sets, stop 5 reps short."};
  }

  var tRIR = RIR_BY_WEEK[week], rir = last.rir;
  if (lastSore === 3) return {weight:last.weight, reps:last.bestReps, why:"You were still sore going in last time \u2014 repeat the same load instead of adding."};
  if (rir != null && rir >= tRIR + 2 && last.bestReps >= ex.hi)
    return {weight:roundLoad(ex, last.weight + step * 2), reps:ex.lo, why:last.bestReps + " reps with " + rir + " left in the tank \u2014 jump " + (step * 2) + " lb."};
  if (last.bestReps >= ex.hi)
    return {weight:roundLoad(ex, last.weight + step), reps:ex.lo, why:"Top of the rep range last time (" + last.bestReps + ") \u2014 add " + step + " lb and reset to " + ex.lo + "."};
  if (last.bestReps < ex.lo)
    return {weight:roundLoad(ex, last.weight - step), reps:ex.lo, why:"Only " + last.bestReps + " reps last time, below the range \u2014 drop " + step + " lb and rebuild."};
  if (rir === 0 && week === 1)
    return {weight:last.weight, reps:last.bestReps, why:"You hit failure last time and it's only week 1 \u2014 repeat, don't chase."};
  return {weight:last.weight, reps:last.bestReps + 1, why:"Same " + fmt(last.weight) + " lb, one more rep than last time (" + last.bestReps + ")."};
}

function lastSorenessFor(muscle, history){
  for (var i = history.length - 1; i >= 0; i--){
    var fb = history[i].feedback || {};
    if (fb[muscle]) return fb[muscle].s;
  }
  return null;
}

function musclesOf(day){
  var out = [];
  day.exercises.forEach(function(e){ if (out.indexOf(e.muscle) < 0) out.push(e.muscle); });
  return out;
}

function groupByMuscle(day){
  var out = [];
  day.exercises.forEach(function(ex){
    var g = out.filter(function(x){ return x.muscle === ex.muscle; })[0];
    if (!g){ g = {muscle:ex.muscle, exercises:[]}; out.push(g); }
    g.exercises.push(ex);
  });
  return out;
}

/* ============================== STORAGE ============================== */

var KEY = "ppl-block-v1";
var memory = null;

function loadState(){
  try {
    var raw = localStorage.getItem(KEY);
    if (raw){
      var s = JSON.parse(raw);
      /* drafts saved before feedback moved into the session */
      if (s.draft && !s.draft.fb) s.draft.fb = {};
      return s;
    }
  } catch (e) { /* storage blocked \u2014 fall through */ }
  return memory || {index:0, history:[], draft:null};
}
function saveState(){
  memory = state;
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}

/* ============================== STATE ============================== */

var state = loadState();
var tab = "workout", view = "home", summary = null, openWhy = null, selEx = null, confirmErase = false;
var needWeight = null;  /* "exId:i" of a set that was tapped with no weight in it */
var ask = null;         /* {m:muscle, kinds:["s"|"p"|"v"]} — the sheet asking mid-session */

/* Which session the home screen is looking at. null means the live one. Only
   the live session is ever writable — peeking is read-only by construction,
   because every action reads ctx() with no argument. */
var peek = null;

function peekIndex(){ return peek == null ? state.index : peek; }
function peekLast(){ return state.index + SESSIONS_PER_BLOCK - 1; }
function peeking(){ return peekIndex() !== state.index; }

/* Absolute session index, not the position inside the block. Pass one to look
   at a future session; targets come out of the same engine the live session
   uses, so they are a projection from everything logged so far. */
function ctx(absIndex){
  var abs = absIndex == null ? state.index : absIndex;
  var idx = abs % SESSIONS_PER_BLOCK;
  var day = dayOf(idx);
  var counts = setCountsForDay(day.id, state.history);
  var targets = {};
  day.exercises.forEach(function(ex){
    targets[ex.id] = prescribe(ex, idx, state.history, lastSorenessFor(ex.muscle, state.history));
  });
  return {
    abs: abs, idx: idx, block: Math.floor(abs / SESSIONS_PER_BLOCK) + 1,
    week: weekOf(idx), day: day, dl: isDeload(idx), counts: counts, targets: targets
  };
}
function plannedSets(c, ex){
  return c.dl ? Math.max(1, Math.ceil(c.counts[ex.id] / 2)) : c.counts[ex.id];
}

/* ============================== VIEWS ============================== */

/* A way out to a demo when you cannot picture the movement. Plain link, no
   data-a, so the delegated click handler ignores it. */
function videoHTML(ex){
  return '<a class="vid" target="_blank" rel="noopener noreferrer"' +
    ' aria-label="Search YouTube for ' + ex.name + '"' +
    ' href="https://www.youtube.com/results?search_query=' + encodeURIComponent(ex.name) + '">' +
    '<svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true" focusable="false">' +
    '<rect x="2" y="4.5" width="20" height="15" rx="4.5" fill="none" stroke="currentColor" stroke-width="2"/>' +
    '<path d="M10 8.9v6.2l5.2-3.1z" fill="currentColor"/></svg></a>';
}

/* Bodyweight and timed work has no load to show, enter, or progress. */
function loadless(ex){ return !!(ex.bw || ex.time); }

/* What goes wherever a load would otherwise be printed. */
function loadLabel(ex, w, blank){
  if (loadless(ex)) return "N/A";
  if (w == null) return blank || "—";
  return fmt(w) + " lb";
}

function tagHTML(m){
  return '<span class="tag" style="--c:' + (HUE[m] || "#a3a3a3") + '"><b><s></s><s></s><s></s></b>' + m + '</span>';
}

function headerHTML(c, live){
  /* Progress is always drawn from the live session; the peeked one gets its own
     marker, but only inside the same block, where the rail can place it. */
  var at = live ? live.idx : c.idx;
  var mark = live && c.block === live.block ? c.idx : -1;
  var rail = "";
  for (var i = 0; i < SESSIONS_PER_BLOCK; i++){
    var cls = i === at ? "now" : i < at ? "done" : isDeload(i) ? "dl" : "";
    if (i === mark && i !== at) cls += " peek";
    rail += '<i class="' + cls + '"></i>';
  }
  return '<header><div class="htop"><h1>' +
    (c.dl ? "<em>DELOAD</em>" : "WEEK " + c.week) + ' <span>DAY ' + (c.idx % 4 + 1) + '</span></h1>' +
    '<span class="eyebrow">Block ' + c.block + '</span></div>' +
    '<p class="muted" style="font-size:14px">' + c.day.name + ' \u00b7 Push Pull Legs Full ' + c.block + '</p>' +
    '<div class="rail">' + rail + '</div></header>';
}

function viewHome(c, live){
  var total = c.day.exercises.reduce(function(a, e){ return a + plannedSets(c, e); }, 0);
  var ahead = c.abs - live.abs;
  var h = headerHTML(c, live) + '<div class="wrap">';

  h += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">' +
    '<button class="chip" data-a="peekprev"' + (ahead ? "" : " disabled") + ' style="flex-shrink:0">‹</button>' +
    '<p class="eyebrow" style="flex:1;text-align:center">' +
    (ahead ? ahead + " session" + (ahead === 1 ? "" : "s") + " ahead" : "Up next") + '</p>' +
    '<button class="chip" data-a="peeknext"' + (c.abs >= peekLast() ? " disabled" : "") + ' style="flex-shrink:0">›</button></div>';

  if (ahead){
    h += '<div class="card" style="padding:12px;margin-bottom:16px">' +
      '<p class="muted" style="font-size:14px">Looking ahead. These numbers are projected from what you have logged so far — they move as you train and answer feedback. Nothing here can be logged until it is the session in front of you.</p></div>';
  }

  if (c.dl){
    h += '<div class="card" style="border-color:rgba(56,189,248,.3);background:rgba(56,189,248,.08);padding:14px;margin-bottom:16px">' +
      '<p style="font-weight:700;color:var(--deload);font-size:14px">Deload week \u2014 automatic</p>' +
      '<p class="muted" style="font-size:14px;margin-top:4px">Half the sets, 60% of your loads, stop 5 reps short. No feedback this week; your set counts carry into the next block untouched.</p></div>';
  }

  h += '<p class="muted" style="font-size:14px;margin-bottom:14px"><b class="num" style="color:var(--ink)">' + total +
    '</b> hard sets \u00b7 <b class="num" style="color:var(--ink)">' + c.day.exercises.length +
    '</b> exercises \u00b7 <b class="num" style="color:var(--ink)">' + state.history.length + '</b> sessions logged</p>';

  groupByMuscle(c.day).forEach(function(g){
    h += '<div style="margin-bottom:16px">' + tagHTML(g.muscle) + '<div class="card list" style="margin-top:8px">';
    g.exercises.forEach(function(ex){
      var t = c.targets[ex.id];
      h += '<div class="rowline"><div style="min-width:0"><p class="name">' + ex.name + '</p>' +
        '<p class="dim" style="font-size:12px">' + ex.gear + '</p></div>' +
        '<div style="text-align:right;flex-shrink:0"><p class="num" style="font-size:14px">' +
        plannedSets(c, ex) + ' \u00d7 ' + t.reps + (ex.time ? "s" : "") + '</p>' +
        '<p class="num dim" style="font-size:12px">' + loadLabel(ex, t.weight, "pick a load") + '</p></div></div>';
    });
    h += '</div></div>';
  });

  h += ahead
    ? '<button class="btn ghost" data-a="peektoday">Back to the session in front of you</button></div>'
    : '<button class="btn go" data-a="' + (state.draft ? "resume" : "start") + '">' +
      (state.draft ? "Resume workout" : "Start workout") + '</button></div>';
  return h;
}

function viewSession(c){
  var d = state.draft;
  var h = headerHTML(c) +
    '<div style="padding:10px 16px 0"><button class="eyebrow" data-a="back">\u2039 Back</button></div>' +
    '<div style="padding:8px 16px 14px"><p class="eyebrow">Target effort: leave <span style="color:var(--ink)">' +
    RIR_BY_WEEK[c.week] + '</span> reps in reserve</p></div>';

  groupByMuscle(c.day).forEach(function(g){
    h += '<div style="padding:8px 16px">' + tagHTML(g.muscle) + '</div>';
    g.exercises.forEach(function(ex){
      var t = c.targets[ex.id], rows = d.sets[ex.id] || [];
      h += '<div class="ex"><div class="exhead"><div><h3>' + ex.name + '</h3>' +
        '<p class="dim" style="font-size:14px">' + ex.gear + '</p></div>' +
        '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0">' + videoHTML(ex) +
        '<button class="chip" data-a="why" data-ex="' + ex.id + '">Why?</button></div></div>';

      h += '<div class="target"><span>Target</span><b>' + loadLabel(ex, t.weight) +
        ' \u00d7 ' + t.reps + (ex.time ? "s" : "") + '</b><span class="dim">(' + ex.lo + "\u2013" + ex.hi + (ex.time ? "s" : "") + ')</span></div>';

      if (ex.gear === "Barbell" && t.weight > 0){
        var ps = platesPerSide(t.weight);
        h += '<p class="num dim" style="font-size:12px;margin-top:3px">' + (ps ? "bar + " + ps + " per side" : "empty bar") + '</p>';
      }
      if (openWhy === ex.id) h += '<div class="why">' + t.why + '</div>';

      h += '<div class="grid" style="margin-top:14px"><span class="eyebrow">Set</span>' +
        '<span class="eyebrow">' + (ex.time ? "Load" : "Weight") + '</span>' +
        '<span class="eyebrow">' + (ex.time ? "Seconds" : "Reps") + '</span>' +
        '<span class="eyebrow">Log</span></div>';

      rows.forEach(function(r, i){
        var ph = t.weight == null ? "lb" : fmt(t.weight);
        var nag = needWeight === ex.id + ":" + i;
        h += '<div class="grid" style="margin-top:8px"><span class="num dim" style="text-align:center;font-size:14px">' + (i + 1) + '</span>' +
          (loadless(ex)
            ? '<div class="cell dim" style="border-style:dashed">N/A</div>'
            : '<input class="cell' + (nag ? " need" : "") + '" inputmode="decimal" data-ex="' + ex.id + '" data-i="' + i + '" data-f="w" value="' + r.w + '" placeholder="' + ph + '">') +
          '<input class="cell" inputmode="numeric" data-ex="' + ex.id + '" data-i="' + i + '" data-f="r" value="' + r.r + '" placeholder="' + t.reps + '">' +
          '<button class="log' + (r.done ? " on" : "") + '" data-a="toggle" data-ex="' + ex.id + '" data-i="' + i + '">\u2713</button></div>';
        if (nag) h += '<p style="color:var(--ask);font-size:12px;margin-top:6px">Put in the weight you used and this set will log.</p>';
      });

      h += '<div style="display:flex;gap:10px;margin-top:14px">' +
        '<button class="chip" data-a="addset" data-ex="' + ex.id + '">+ Set</button>' +
        '<button class="chip" data-a="dropset" data-ex="' + ex.id + '">\u2212 Set</button></div>';

      if (!c.dl && !ex.time){
        h += '<p class="eyebrow" style="margin-top:16px">Reps left on your last set</p><div class="rir">';
        [0,1,2,3,4].forEach(function(v){
          h += '<button class="' + (d.rir[ex.id] === v ? "on" : "") + '" data-a="rir" data-ex="' + ex.id + '" data-v="' + v + '">' + (v === 4 ? "4+" : v) + '</button>';
        });
        h += '</div>';
      }
      h += '</div>';
    });
  });

  var totalSets = 0, doneSets = 0;
  Object.keys(d.sets).forEach(function(k){
    totalSets += d.sets[k].length;
    doneSets += d.sets[k].filter(function(x){ return x.done; }).length;
  });

  var left = totalSets - doneSets;
  h += '<div class="wrap"><p class="muted center" style="font-size:14px;margin-bottom:12px">' +
    '<b class="num" style="color:var(--ink)">' + doneSets + '</b> of ' + totalSets + ' sets logged</p>';
  h += left
    ? '<button class="btn ghost" disabled>' + left + ' set' + (left === 1 ? "" : "s") + ' still to log</button>' +
      '<p class="dim center" style="font-size:12px;margin-top:10px">Every set gets logged before a session closes. ' +
      'Use − Set on anything you are not doing.</p>'
    : '<button class="btn go" data-a="finish">' + (c.dl ? "Finish deload session" : "Finish session") + '</button>';
  h += '</div>';
  if (ask) h += viewAsk();
  return h;
}

function trainedBefore(m){
  return state.history.some(function(h){
    if (h.deload) return false;
    var day = DAYS.filter(function(d){ return d.id === h.dayId; })[0];
    return day.exercises.some(function(e){ return e.muscle === m; });
  });
}

/* Answers live on the draft, so they survive a reload mid-session. */
function fbFor(m){
  if (!state.draft.fb[m]) state.draft.fb[m] = {s:null, p:null, v:null};
  return state.draft.fb[m];
}
function exercisesFor(day, m){
  return day.exercises.filter(function(e){ return e.muscle === m; });
}
function groupStarted(c, m){
  return exercisesFor(c.day, m).some(function(ex){
    return (state.draft.sets[ex.id] || []).some(function(r){ return r.done; });
  });
}
function groupDone(c, m){
  return exercisesFor(c.day, m).every(function(ex){
    var rows = state.draft.sets[ex.id] || [];
    return rows.length > 0 && rows.every(function(r){ return r.done; });
  });
}

/* Soreness goes with the first set of a muscle — it is about last time, and
   asking once the work is done invites you to answer about today. Pump and
   volume go with the last set, while the muscle still remembers. */
function pendingFor(c, m){
  var fb = fbFor(m), kinds = [];
  if (fb.s == null && trainedBefore(m) && groupStarted(c, m)) kinds.push("s");
  if (groupDone(c, m)){
    if (fb.p == null) kinds.push("p");
    if (fb.v == null) kinds.push("v");
  }
  return kinds;
}
/* How many planned sets are still unlogged in the open session. */
function setsLeft(){
  if (!state.draft) return 0;
  var n = 0;
  Object.keys(state.draft.sets).forEach(function(k){
    n += state.draft.sets[k].filter(function(r){ return !r.done; }).length;
  });
  return n;
}

function askIfPending(c, m){
  var kinds = pendingFor(c, m);
  if (kinds.length) ask = {m: m, kinds: kinds};
}

/* Adding or dropping a set changes the amount of work, so the pump and volume
   answers no longer describe what was done and get asked again. Soreness is
   about last time and stands. */
function volumeChanged(c, exId){
  var ex = c.day.exercises.filter(function(e){ return e.id === exId; })[0];
  var fb = fbFor(ex.muscle);
  fb.p = null; fb.v = null;
  askIfPending(c, ex.muscle);
}

function missingFeedback(c){
  return musclesOf(c.day).filter(function(m){
    var fb = fbFor(m);
    return fb.p == null || fb.v == null || (trainedBefore(m) && fb.s == null);
  });
}

var QUESTION = {
  s: {list: SORENESS, head: " soreness", q: function(m){ return "How sore did you get in your " + m + " AFTER training them LAST TIME?"; }},
  p: {list: PUMP, head: " pump", q: function(m){ return "How much of a pump did you get today in your " + m + "?"; }},
  v: {list: WORKLOAD, head: " volume", q: function(m){ return "How was the volume of work (number of hard sets) for your " + m + "?"; }}
};

function optsHTML(m, k, action){
  var list = QUESTION[k].list, cur = fbFor(m)[k];
  var h = '<div class="opts" style="grid-template-columns:repeat(' + (list.length === 3 ? 3 : 2) + ',1fr)">';
  list.forEach(function(label, i){
    h += '<button class="' + (cur === i ? "on" : "") + '" data-a="' + action + '" data-m="' + m + '" data-k="' + k + '" data-v="' + i + '">' + label + '</button>';
  });
  return h + '</div>';
}

/* The sheet that interrupts the session for one muscle's questions. */
function viewAsk(){
  var m = ask.m, kinds = ask.kinds;
  var ready = kinds.every(function(k){ return fbFor(m)[k] != null; });
  var h = '<div class="scrim"><div class="sheet"><p class="eyebrow">' +
    (kinds[0] === "s" ? "Before your first set" : "That is your " + m + " done") + '</p>' +
    '<div style="margin:10px 0 4px">' + tagHTML(m) + '</div>';
  kinds.forEach(function(k){
    h += '<h3>' + m + QUESTION[k].head + '</h3><p class="q">' + QUESTION[k].q(m) + '</p>' + optsHTML(m, k, "ask");
  });
  return h + '<div style="display:flex;justify-content:flex-end;align-items:center;gap:22px;margin-top:22px">' +
    '<button style="font-size:15px;font-weight:700;color:var(--muted)" data-a="asklater">Not now</button>' +
    '<button class="save" data-a="asksave"' + (ready ? "" : " disabled") + '>Save</button></div></div></div>';
}

function viewFeedback(c){
  var muscles = missingFeedback(c);
  var complete = !muscles.length;

  function opts(list, m, k){ return optsHTML(m, k, "fb"); }

  var h = '<div class="fb"><div style="display:flex;justify-content:space-between;align-items:flex-start">' +
    '<h2>Feedback</h2><button style="font-size:30px;color:var(--muted);line-height:1" data-a="fbcancel">\u00d7</button></div>' +
    '<p class="muted" style="font-size:14px;margin-top:6px">' +
    'What you skipped during the session. This is what sets next session\u2019s sets, weight, and reps.</p>';

  muscles.forEach(function(m){
    var fb = fbFor(m);
    if (trainedBefore(m) && fb.s == null){
      h += '<h3>' + m + QUESTION.s.head + '</h3><p class="q">' + QUESTION.s.q(m) + '</p>' + opts(SORENESS, m, "s");
    }
    if (fb.p == null) h += '<h3>' + m + QUESTION.p.head + '</h3><p class="q">' + QUESTION.p.q(m) + '</p>' + opts(PUMP, m, "p");
    if (fb.v == null) h += '<h3>' + m + QUESTION.v.head + '</h3><p class="q">' + QUESTION.v.q(m) + '</p>' + opts(WORKLOAD, m, "v");
    h += '<div class="rule"></div>';
  });

  h += '<div style="display:flex;justify-content:flex-end;align-items:center;gap:22px;margin-top:26px">' +
    '<button style="font-size:17px;font-weight:700;color:var(--muted)" data-a="fbcancel">Cancel</button>' +
    '<button class="save" data-a="fbsave"' + (complete ? "" : " disabled") + '>Save</button></div>';
  if (!complete) h += '<p class="dim" style="font-size:12px;text-align:right;margin-top:8px">Answer every question to save.</p>';
  return h + '</div>';
}

  }

  h += '<p class="eyebrow" style="margin:22px 0 8px">Your targets</p><div class="card list">';
  s.targets.forEach(function(t){
    h += '<div><div class="rowline"><p class="name">' + t.ex.name + '</p>' +

      (loadless(t.ex) ? "N/A" : t.weight == null ? "" : "@ " + fmt(t.weight) + " lb") + '</p></div>' +
      '<p class="dim" style="font-size:12px;margin-top:4px">' + t.why + '</p></div>';
  });
  h += '</div><button class="btn ghost" style="margin-top:22px" data-a="summarydone">Done</button></div>';
  return h;
}

function viewProgress(){
  if (!state.history.length){
    return '<div class="wrap center" style="padding-top:70px"><h2 style="font-size:24px;font-weight:900">No sessions yet</h2>' +
      '<p class="muted" style="font-size:14px;margin-top:8px">Log your first workout and your strength curve shows up here.</p></div>';
  }
  var all = [];
  DAYS.forEach(function(d){ all = all.concat(d.exercises); });
  all = all.concat(RETIRED);
  var logged = all.filter(function(ex){
    return state.history.some(function(h){
      var r = (h.sets || {})[ex.id];
      return r && r.some(function(x){ return x.done; });
    });
  });
  if (!selEx || !logged.some(function(e){ return e.id === selEx; })) selEx = logged.length ? logged[0].id : null;
  var ex = all.filter(function(e){ return e.id === selEx; })[0];

  var h = '<div class="wrap"><h2 style="font-size:24px;font-weight:900">Progress</h2>' +
    '<p class="muted" style="font-size:14px;margin-top:4px">Estimated best set, session by session.</p>' +
    '<div style="display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px">';
  logged.forEach(function(e){
    h += '<button class="chip' + (selEx === e.id ? " on" : "") + '" style="flex-shrink:0;white-space:nowrap" data-a="selex" data-ex="' + e.id + '">' + e.name + '</button>';
  });
  h += '</div>';

  if (ex){
    var pts = [];
    state.history.forEach(function(hh){
      var rows = ((hh.sets || {})[ex.id] || []).filter(function(r){ return r.done && Number(r.r) > 0; });
      if (!rows.length) return;
      var best = 0;
      rows.forEach(function(r){
        var w = Number(r.w) || 0;
        var val = w > 0 ? w * (1 + Number(r.r) / 30) : Number(r.r);
        if (val > best) best = val;
      });
      pts.push({v:best, deload:!!hh.deload});
    });
    if (pts.length) h += spark(pts, ex.time ? "s" : ex.bw ? "reps" : "lb");
  }

  h += '<p class="eyebrow" style="margin:26px 0 8px">Session log</p><div class="stack">';
  state.history.slice().reverse().forEach(function(hh){
    var day = DAYS.filter(function(d){ return d.id === hh.dayId; })[0];
    var n = 0;
    Object.keys(hh.sets || {}).forEach(function(k){ n += hh.sets[k].filter(function(x){ return x.done; }).length; });
    h += '<div class="card rowline" style="padding:12px"><div><p style="font-size:14px;font-weight:700">' + day.name +
      ' <span class="dim">\u00b7 ' + (hh.deload ? "Deload" : "Block " + hh.block + " wk " + hh.week) + '</span></p>' +
      '<p class="dim" style="font-size:12px">' + new Date(hh.ts).toLocaleDateString(undefined, {month:"short", day:"numeric"}) + '</p></div>' +
      '<span class="num muted" style="font-size:14px">' + n + ' sets</span></div>';
  });
  return h + '</div></div>';
}

function spark(pts, unit){
  var W = 320, H = 140;
  var vals = pts.map(function(p){ return p.v; });
  var min = Math.min.apply(null, vals) * 0.95, max = Math.max.apply(null, vals) * 1.05;
  var span = (max - min) || 1;
  function X(i){ return pts.length === 1 ? W / 2 : (i / (pts.length - 1)) * (W - 24) + 12; }
  function Y(v){ return H - 20 - ((v - min) / span) * (H - 40); }
  var path = pts.map(function(p, i){ return (i ? "L" : "M") + X(i).toFixed(1) + "," + Y(p.v).toFixed(1); }).join(" ");
  var dots = pts.map(function(p, i){
    return '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(p.v).toFixed(1) + '" r="' + (p.deload ? 3 : 4) + '" fill="' + (p.deload ? "#38bdf8" : "#34d399") + '"/>';
  }).join("");
  return '<div class="card" style="padding:12px"><svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%" role="img" aria-label="Progress chart">' +
    '<path d="' + path + '" fill="none" stroke="#34d399" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' + dots +
    '<text x="12" y="' + (H - 4) + '" fill="#737373" font-size="10" font-family="monospace">' + vals[0].toFixed(0) + '</text>' +
    '<text x="' + (W - 12) + '" y="' + (H - 4) + '" fill="#a3a3a3" font-size="10" text-anchor="end" font-family="monospace">' +
    vals[vals.length - 1].toFixed(0) + ' ' + unit + '</text></svg>' +
    '<p class="dim" style="font-size:12px">Green = working session, blue = deload.</p></div>';
}

function viewPlan(c){
  var h = '<div class="wrap"><h2 style="font-size:24px;font-weight:900">The block</h2>' +
    '<p class="muted" style="font-size:14px;margin-top:4px">Four weeks of work, then a deload week, then it repeats with your tuned set counts and heavier bars.</p><div class="stack mt">';
  for (var wk = 1; wk <= WEEKS_PER_BLOCK; wk++){

      '<div class="rowline"><h3 style="font-size:16px;font-weight:800">' + (wk === DELOAD_WEEK ? "Deload" : "Week " + wk) + '</h3>' +

  var countsByDay = {};

    /* plannedSets only reads .dl and .counts, so a bare shape is enough here. */

      var tot = d.exercises.reduce(function(a, ex){ return a + plannedSets(shape, ex); }, 0);
      var cls = abs < state.index ? "past" : abs === state.index ? "now" : abs === peekIndex() ? "peek" : "";
      var body = '<p style="font-size:12px;font-weight:800;text-transform:uppercase">' + d.name.split(" ")[0] + '</p>' +
        '<p class="dim num" style="font-size:11px;margin-top:2px">' + tot + ' sets</p>';
      h += abs < state.index
        ? '<div class="cell-day past">' + body + '</div>'
        : '<button class="cell-day ' + cls + '" data-a="peekat" data-i="' + abs + '">' + body + '</button>';

    '<li style="margin-bottom:6px">Landed inside the range \u2192 same weight, one more rep.</li>' +
    '<li style="margin-bottom:6px">Fell below the range \u2192 the load comes back down 5 or 10 lb.</li>' +
    '<li style="margin-bottom:6px">Still sore walking in \u2192 the load repeats instead of climbing.</li>' +
    '<li style="margin-bottom:6px">Sets move per muscle from your soreness, pump, and volume answers \u2014 capped at 10 per muscle per session.</li>' +
    '<li>Barbell targets show the plates per side off a 45 lb bar.</li></ul></div>';
  return h;
}

/* ============================== RENDER ============================== */

var app = document.getElementById("app");
var navEl = document.getElementById("nav");
var TABS = [["workout","Workout"],["progress","Progress"],["plan","Plan"],["settings","Settings"]];

function render(keepScroll){
  var y = window.scrollY;
  var c = ctx();
  var html;
  if (tab === "workout"){
    if (view === "session" && state.draft) html = viewSession(c);
    else if (view === "feedback" && state.draft) html = viewFeedback(c);
    else if (view === "summary" && summary) html = viewSummary();
    /* the only screen that may show a session other than the live one */
    else html = viewHome(ctx(peekIndex()), c);
  } else if (tab === "progress") html = viewProgress();
  else if (tab === "plan") html = viewPlan(c);
  else html = viewSettings(c);

  app.innerHTML = html;
  navEl.innerHTML = TABS.map(function(t){
    return '<button class="' + (tab === t[0] ? "on" : "") + '" data-a="nav" data-tab="' + t[0] + '">' + t[1] + '</button>';
  }).join("");
  if (keepScroll) window.scrollTo(0, y); else window.scrollTo(0, 0);
  if (deferredPrompt) { var box = document.getElementById("install"); if (box) box.style.display = "block"; }
}

/* ============================== ACTIONS ============================== */

function startSession(){
  var c = ctx(), sets = {};
  c.day.exercises.forEach(function(ex){
    var n = plannedSets(c, ex), arr = [];
    for (var i = 0; i < n; i++) arr.push({w:"", r:"", done:false});
    sets[ex.id] = arr;
  });
  state.draft = {index:state.index, sets:sets, rir:{}, fb:{}};
  saveState();
  view = "session"; openWhy = null; ask = null; render();
}

function commit(feedback){
  var c = ctx();
  state.history.push({
    ts: Date.now(), block: c.block, week: c.week, dayId: c.day.id,
    deload: c.dl, sets: state.draft.sets, rir: state.draft.rir, feedback: feedback
  });
  var deltas = Object.keys(feedback).map(function(m){
    var d = setsDelta(feedback[m]);
    return {muscle:m, d:d, why:reasonForDelta(feedback[m], d)};
  });
  ask = null;
  state.index += 1;
  state.draft = null;
  peek = null;
  saveState();

  var n = ctx();
  summary = {
    justDid: c.day.name, dayName: n.day.name, week: n.week, deload: n.dl,
    deltas: deltas,
    targets: n.day.exercises.map(function(ex){
      var t = n.targets[ex.id];
      return {ex:ex, sets:plannedSets(n, ex), reps:t.reps, weight:t.weight, why:t.why};
    })
  };
  fbDraft = null; view = "summary"; render();
}

document.addEventListener("click", function(e){
  var el = e.target.closest("[data-a]");
  if (!el) return;
  var a = el.dataset.a, exId = el.dataset.ex, c = ctx();

  if (a === "nav"){
    tab = el.dataset.tab;
    if (tab === "workout" && view === "summary") view = "home";
    confirmErase = false; peek = null;
    render(); return;
  }

  /* Looking around the block. Nothing here writes to a session. */
  if (a === "peekprev"){ peek = Math.max(state.index, peekIndex() - 1); render(); return; }
  if (a === "peeknext"){ peek = Math.min(peekLast(), peekIndex() + 1); render(); return; }
  if (a === "peektoday"){ peek = null; render(); return; }
  if (a === "peekat"){
    peek = clamp(Number(el.dataset.i), state.index, peekLast());
    tab = "workout"; view = "home"; render(); return;
  }

  if (a === "start"){ peek = null; startSession(); return; }
  if (a === "resume"){ view = "session"; render(); return; }
  if (a === "back"){ view = "home"; render(); return; }
  if (a === "why"){ openWhy = openWhy === exId ? null : exId; render(true); return; }

  if (a === "toggle"){
    var i = Number(el.dataset.i), row = state.draft.sets[exId][i];
    var t = c.targets[exId];
    var ex = c.day.exercises.filter(function(e){ return e.id === exId; })[0];
    /* Nothing gets into history without a load behind it. Bodyweight movements
       have one already — the body — so they log at 0 with the field empty. */
    if (!row.done && row.w === "" && t.weight == null && !ex.bw){
      needWeight = exId + ":" + i; render(true); return;
    }
    needWeight = null;
    row.done = !row.done;
    if (row.done){
      if (row.w === "") row.w = String(t.weight == null ? 0 : t.weight);
      if (row.r === "") row.r = String(t.reps);
      /* first set of a muscle asks about last time's soreness, last set asks
         about pump and volume. Deloads collect nothing. */
      if (!c.dl) askIfPending(c, ex.muscle);
    }
    saveState(); render(true); return;
  }
  if (a === "addset"){
    state.draft.sets[exId].push({w:"", r:"", done:false});
    if (!c.dl) volumeChanged(c, exId);
    saveState(); render(true); return;
  }
  if (a === "dropset"){
    if (state.draft.sets[exId].length > 1){
      state.draft.sets[exId].pop();
      if (!c.dl) volumeChanged(c, exId);
    }
    saveState(); render(true); return;
  }
  if (a === "rir"){ state.draft.rir[exId] = Number(el.dataset.v); saveState(); render(true); return; }

  if (a === "ask"){ fbFor(el.dataset.m)[el.dataset.k] = Number(el.dataset.v); saveState(); render(true); return; }
  if (a === "asksave" || a === "asklater"){ ask = null; saveState(); render(true); return; }

  if (a === "finish"){
    /* the button is hidden until the last set is in; this is the invariant
       behind it — nothing reaches history half-recorded */
    if (setsLeft()) { render(true); return; }
    ask = null;
    if (c.dl) commit({});
    else if (!missingFeedback(c).length) commit(state.draft.fb);
    else { view = "feedback"; render(); }
    return;
  }
  if (a === "fb"){
    fbFor(el.dataset.m)[el.dataset.k] = Number(el.dataset.v);
    saveState(); render(true); return;
  }
  if (a === "fbcancel"){ view = "session"; render(); return; }
  if (a === "fbsave"){ commit(state.draft.fb); return; }
  if (a === "summarydone"){ view = "home"; render(); return; }
  if (a === "selex"){ selEx = exId; render(true); return; }

  if (a === "skipback"){ state.index = Math.max(0, state.index - 1); state.draft = null; peek = null; saveState(); render(); return; }
  if (a === "skipahead"){ state.index += 1; state.draft = null; peek = null; saveState(); render(); return; }
  if (a === "erase-ask"){ confirmErase = true; render(true); return; }
  if (a === "erase-no"){ confirmErase = false; render(true); return; }
  if (a === "erase-yes"){
    state = {index:0, history:[], draft:null};
    confirmErase = false; peek = null; saveState(); tab = "workout"; view = "home"; render(); return;
  }
  if (a === "install" && deferredPrompt){ deferredPrompt.prompt(); deferredPrompt = null; return; }
});

/* The first set carries the working weight for the exercise, once you leave
   the field — filling in real values rather than leaving the rows to hint at
   it. Sets already logged keep what they were logged with. Writes straight
   into the sibling inputs because this path must not re-render. */
function carryWeightDown(exId, rows, value){
  for (var j = 1; j < rows.length; j++){
    if (rows[j].done) continue;
    rows[j].w = value;
    var el = document.querySelector('input[data-ex="' + exId + '"][data-i="' + j + '"][data-f="w"]');
    if (el) el.value = value;
  }
}

/* typing does not re-render, so the keyboard and caret stay put */
document.addEventListener("input", function(e){
  var t = e.target;
  if (!t.dataset || !t.dataset.ex || !state.draft) return;
  var rows = state.draft.sets[t.dataset.ex];
  if (!rows) return;
  rows[Number(t.dataset.i)][t.dataset.f] = t.value;
  if (t.dataset.f === "w") needWeight = null;
  clearTimeout(window.__saveT);
  window.__saveT = setTimeout(saveState, 400);
});

/* Leaving the first weight field is what carries it down the exercise. Doing
   it per keystroke would flicker 1, 13, 135 through every row below. */
document.addEventListener("focusout", function(e){
  var t = e.target;
  if (!t.dataset || t.dataset.f !== "w" || t.value === "" || !state.draft) return;
  if (Number(t.dataset.i) !== 0) return;
  var rows = state.draft.sets[t.dataset.ex];
  if (!rows) return;
  carryWeightDown(t.dataset.ex, rows, t.value);
  saveState();
});

var deferredPrompt = null;
window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault(); deferredPrompt = e;
  var box = document.getElementById("install");
  if (box) box.style.display = "block";
});

var ONDISK = (typeof location === "undefined") || location.protocol === "file:";

/* Hosted, the manifest and worker are real files next to this one. Opened from
   disk they cannot be fetched, so the blob fallback below keeps install working. */
